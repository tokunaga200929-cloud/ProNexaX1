    #page-calendar { background:#fff !important; overflow-x:hidden !important; }
    .pnx-calendar-v2 { padding-bottom: calc(112px + env(safe-area-inset-bottom, 0px)) !important; }
    .pnx-cal-bottom-nav {
      position: fixed !important;
      left: 50% !important;
      right: auto !important;
      bottom: 0 !important;
      transform: translateX(-50%) !important;
      width: min(100vw, 430px) !important;
      min-height: calc(78px + env(safe-area-inset-bottom, 0px)) !important;
      padding: 8px 14px calc(8px + env(safe-area-inset-bottom, 0px)) !important;
      z-index: 2147483647 !important;
      display: grid !important;
      grid-template-columns: repeat(5, minmax(0, 1fr)) !important;
      align-items: center !important;
      gap: 4px !important;
      background: rgba(255,255,255,.985) !important;
      border: 1px solid rgba(226,232,240,.95) !important;
      border-bottom: 0 !important;
      border-radius: 22px 22px 0 0 !important;
      box-shadow: 0 -10px 26px rgba(15,23,42,.08) !important;
      -webkit-backdrop-filter: blur(18px) saturate(180%) !important;
      backdrop-filter: blur(18px) saturate(180%) !important;
      box-sizing: border-box !important;
      overflow: hidden !important;
    }
    .pnx-cal-bottom-nav, .pnx-cal-bottom-nav * { box-sizing: border-box !important; }
    .pnx-cal-bottom-nav .pnx-cal-nav-item {
      appearance: none !important;
      -webkit-appearance: none !important;
      display: flex !important;
      flex-direction: column !important;
      align-items: center !important;
      justify-content: center !important;
      gap: 4px !important;
      width: auto !important;
      min-width: 0 !important;
      height: 58px !important;
      min-height: 58px !important;
      max-height: 58px !important;
      margin: 0 !important;
      padding: 0 !important;
      border: 0 !important;
      border-radius: 16px !important;
      background: transparent !important;
      color: #0f172a !important;
      font-family: -apple-system,BlinkMacSystemFont,"SF Pro Text","Hiragino Sans","Noto Sans JP",sans-serif !important;
      font-size: 11.5px !important;
      font-weight: 430 !important;
      line-height: 1 !important;
      letter-spacing: -.035em !important;
      white-space: nowrap !important;
      text-align: center !important;
    }
    .pnx-cal-bottom-nav .pnx-cal-nav-item.is-active {
      color:#0a74ff !important;
      background: linear-gradient(180deg, rgba(235,244,255,.98), rgba(242,247,255,.98)) !important;
      box-shadow: inset 0 0 0 1px rgba(10,116,255,.16) !important;
      font-weight: 540 !important;
    }
    .pnx-cal-bottom-nav .pnx-cal-nav-item svg {
      display:block !important;
      width:23px !important; height:23px !important;
      min-width:23px !important; min-height:23px !important;
      max-width:23px !important; max-height:23px !important;

      stroke-width:1.85 !important;
      stroke-linecap:round !important;
      stroke-linejoin:round !important;
      overflow:visible !important;
    }
    .pnx-cal-bottom-nav .pnx-cal-nav-item svg * {
      fill:none !important;
      stroke:currentColor !important;
      stroke-width:inherit !important;
      stroke-linecap:round !important;
      stroke-linejoin:round !important;
    }
    .pnx-cal-bottom-nav .pnx-cal-nav-item span {
      display:block !important;
      width:100% !important;
      overflow:hidden !important;
      text-overflow:ellipsis !important;
      white-space:nowrap !important;
      color:currentColor !important;
    }
    @media (max-width: 374px) {
      .pnx-cal-bottom-nav { padding-left:8px !important; padding-right:8px !important; gap:2px !important; }
      .pnx-cal-bottom-nav .pnx-cal-nav-item { height:55px !important; min-height:55px !important; max-height:55px !important; font-size:10.5px !important; border-radius:14px !important; }
      .pnx-cal-bottom-nav .pnx-cal-nav-item svg { width:21px !important; height:21px !important; min-width:21px !important; min-height:21px !important; max-width:21px !important; max-height:21px !important; }
    }

<body>
<!--
  本体統合時は、ここから </section> までを index.html の page-calendar に入れてください。
  calendar.css と calendar.js は既存本体側で読み込んでください。
-->
<section id="page-calendar" class="page active">
  <div class="pnx-calendar-v2" data-pnx-calendar-v2>
    <header class="pnx-cal-header" aria-label="ProNexaX calendar header">
      <button class="pnx-cal-header-btn pnx-cal-menu-btn" type="button" data-pnx-action="menu" aria-label="メニュー">
        <svg viewBox="0 0 28 28" aria-hidden="true">
          <path d="M5.5 8.2H22.5" />
          <path d="M5.5 14H22.5" />
          <path d="M5.5 19.8H22.5" />
        </svg>
      </button>

      <div class="pnx-cal-brand" aria-label="ProNexaX">
        <img class="pnx-cal-brand-img" src="assets/pronexax-logo-wordmark.png" alt="ProNexaX">
      </div>

      <div class="pnx-cal-actions" aria-label="操作">
        <button class="pnx-cal-header-btn" type="button" data-pnx-action="search" aria-label="検索">
          <svg viewBox="0 0 28 28" aria-hidden="true">
            <circle cx="12.2" cy="12.2" r="7.2" />
            <path d="M17.5 17.5L23 23" />
          </svg>
        </button>
        <button class="pnx-cal-header-btn pnx-cal-bell-btn" type="button" data-pnx-action="notify" aria-label="通知">
          <svg viewBox="0 0 28 28" aria-hidden="true">
            <path d="M8.2 13.1C8.2 9.3 10.8 6.5 14 6.5C17.2 6.5 19.8 9.3 19.8 13.1V16.4C19.8 17.4 20.4 18.3 21.2 18.9L21.8 19.3H6.2L6.8 18.9C7.7 18.3 8.2 17.4 8.2 16.4V13.1Z" />
            <path d="M11.8 22C12.3 22.9 13 23.4 14 23.4C15 23.4 15.7 22.9 16.2 22" />
            <path d="M14 4.3V6.4" />
          </svg>
          <span class="pnx-cal-bell-dot" aria-hidden="true"></span>
        </button>
        <button class="pnx-cal-add-btn" type="button" data-pnx-action="add" aria-label="予定を追加">
          <svg viewBox="0 0 28 28" aria-hidden="true">
            <path d="M14 7V21" />
            <path d="M7 14H21" />
          </svg>
        </button>
      </div>
    </header>

    <div class="pnx-cal-monthbar" aria-label="月切り替え">
      <button class="pnx-cal-month-nav" type="button" data-pnx-action="prev-month" aria-label="前の月">
        <svg viewBox="0 0 28 28" aria-hidden="true"><path d="M17 7.5L10.5 14L17 20.5" /></svg>
      </button>
      <button class="pnx-cal-month-label" type="button" data-pnx-action="pick-month" aria-label="月を選択" aria-expanded="false" aria-controls="pnx-month-popover">
        <span data-pnx-month-label>2026年 5月</span>
        <svg viewBox="0 0 28 28" aria-hidden="true"><path d="M9 11.5L14 16.5L19 11.5" /></svg>
      </button>
      <button class="pnx-cal-month-nav" type="button" data-pnx-action="next-month" aria-label="次の月">
        <svg viewBox="0 0 28 28" aria-hidden="true"><path d="M11 7.5L17.5 14L11 20.5" /></svg>
      </button>
    </div>

    <div class="pnx-cal-month-popover" id="pnx-month-popover" data-pnx-month-popover aria-hidden="true">
      <div class="pnx-cal-month-popover-head">
        <button class="pnx-cal-month-popover-nav" type="button" data-pnx-action="month-picker-prev-year" aria-label="前の年">
          <svg viewBox="0 0 28 28" aria-hidden="true"><path d="M17 7.5L10.5 14L17 20.5" /></svg>
        </button>
        <strong data-pnx-month-picker-year>2026年</strong>
        <button class="pnx-cal-month-popover-nav" type="button" data-pnx-action="month-picker-next-year" aria-label="次の年">
          <svg viewBox="0 0 28 28" aria-hidden="true"><path d="M11 7.5L17.5 14L11 20.5" /></svg>
        </button>
      </div>
      <div class="pnx-cal-month-popover-line" aria-hidden="true"></div>
      <div class="pnx-cal-month-popover-grid" data-pnx-month-picker-grid aria-label="月を選択"></div>
    </div>

    <div class="pnx-cal-weekdays" aria-hidden="true">
      <div class="is-sun">日</div>
      <div>月</div>
      <div>火</div>
      <div>水</div>
      <div>木</div>
      <div>金</div>
      <div class="is-sat">土</div>
    </div>

    <div class="pnx-cal-grid" data-pnx-grid aria-label="月間カレンダー"></div>

    <section class="pnx-cal-sheet" aria-label="選択日の予定">
      <div class="pnx-cal-sheet-handle" aria-hidden="true"></div>
      <div class="pnx-cal-sheet-toolbar">
        <div class="pnx-cal-sheet-left">
          <div class="pnx-cal-date-pill" data-pnx-sheet-date>5月20日（水）</div>
          <button class="pnx-cal-today-pill" type="button" data-pnx-action="today">今日</button>
        </div>
        <div class="pnx-cal-sheet-tools">
          <button class="pnx-cal-tool-btn" type="button" data-pnx-action="day-view">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="4.3" y="5.4" width="15.4" height="15" rx="2.2" />
              <path d="M4.3 10H19.7" />
              <path d="M8.3 3.8V7" />
              <path d="M15.7 3.8V7" />
            </svg>
            <span>日表示</span>
          </button>
          <button class="pnx-cal-tool-btn" type="button" data-pnx-action="filter">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4.5 7H19.5" />
              <path d="M7.5 12H16.5" />
              <path d="M10.5 17H13.5" />
            </svg>
            <span>絞り込み</span>
          </button>
        </div>
      </div>
      <div class="pnx-cal-event-list" data-pnx-sheet-list></div>
    </section>

    <div class="pnx-cal-add-layer" data-pnx-add-layer aria-hidden="true">
      <button class="pnx-cal-add-backdrop" type="button" data-pnx-action="close-add" aria-label="閉じる"></button>
      <section class="pnx-cal-add-sheet" role="dialog" aria-modal="true" aria-labelledby="pnx-add-title">
        <div class="pnx-cal-add-handle" aria-hidden="true"></div>
        <div class="pnx-cal-add-head">
          <button class="pnx-cal-add-cancel" type="button" data-pnx-action="close-add">キャンセル</button>
          <h2 id="pnx-add-title">新規予定</h2>
          <button class="pnx-cal-add-save-mini" type="button" data-pnx-action="save-add">保存</button>
        </div>

        <div class="pnx-cal-add-body">
          <label class="pnx-cal-title-box" for="pnx-add-title-input">
            <span class="pnx-cal-title-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M4.5 19.5L8.2 18.8L19.1 7.9C19.9 7.1 19.9 5.9 19.1 5.1C18.3 4.3 17.1 4.3 16.3 5.1L5.4 16L4.5 19.5Z"/><path d="M14.8 6.6L17.6 9.4"/></svg>
            </span>
            <input id="pnx-add-title-input" data-pnx-add-title type="text" autocomplete="off" inputmode="text" placeholder="タイトル" value="">
          </label>

          <div class="pnx-cal-add-form">
            <button class="pnx-cal-add-row" type="button" data-pnx-action="toggle-type">
              <span class="pnx-cal-add-row-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 7.5H19"/><path d="M5 12H19"/><path d="M5 16.5H13"/></svg></span>
              <span class="pnx-cal-add-row-label">種類</span>
              <span class="pnx-cal-add-row-value" data-pnx-add-type-label>未設定</span>
              <span class="pnx-cal-add-chevron">›</span>
            </button>

            <div class="pnx-cal-type-panel" data-pnx-type-panel hidden>
              <button type="button" class="pnx-cal-type-chip" data-pnx-type="練習" data-color="green">練習</button>
              <button type="button" class="pnx-cal-type-chip" data-pnx-type="レッスン" data-color="purple">レッスン</button>
              <button type="button" class="pnx-cal-type-chip" data-pnx-type="試合" data-color="blue">試合</button>
              <button type="button" class="pnx-cal-type-chip" data-pnx-type="移動" data-color="orange">移動</button>
              <button type="button" class="pnx-cal-type-chip" data-pnx-type="締切" data-color="red">締切</button>
              <button type="button" class="pnx-cal-type-chip" data-pnx-type="その他" data-color="blue">その他</button>
            </div>

            <button class="pnx-cal-add-row" type="button" data-pnx-action="open-date-range">
              <span class="pnx-cal-add-row-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2.5"/><path d="M4 9H20"/><path d="M8 3.5V6.5"/><path d="M16 3.5V6.5"/></svg></span>
              <span class="pnx-cal-add-row-label">日時</span>
              <span class="pnx-cal-add-row-value" data-pnx-add-date>5月20日（水） 09:00〜10:00</span>
              <span class="pnx-cal-add-chevron">›</span>
            </button>

            <button class="pnx-cal-add-row" type="button" data-pnx-action="open-date-range">
              <span class="pnx-cal-add-row-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 7.5V12L15.2 14"/></svg></span>
              <span class="pnx-cal-add-row-label">時間</span>
              <span class="pnx-cal-add-row-value" data-pnx-add-time>09:00〜10:00</span>
              <span class="pnx-cal-add-chevron">›</span>
            </button>

            <label class="pnx-cal-add-row pnx-cal-add-row-input">
              <span class="pnx-cal-add-row-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 21C12 21 5.5 15.2 5.5 9.7C5.5 6.1 8.4 3.5 12 3.5C15.6 3.5 18.5 6.1 18.5 9.7C18.5 15.2 12 21 12 21Z"/><circle cx="12" cy="9.6" r="2.25"/></svg></span>
              <span class="pnx-cal-add-row-label">場所</span>
              <input data-pnx-add-place type="text" autocomplete="off" placeholder="場所を入力" value="">
            </label>

            <label class="pnx-cal-add-memo">
              <span class="pnx-cal-add-memo-label">メモ</span>
              <textarea data-pnx-add-memo maxlength="200" placeholder="メモを入力"></textarea>
            </label>

            <div class="pnx-cal-notify-row">
              <span class="pnx-cal-notify-label">通知</span>
              <div class="pnx-cal-notify-options" data-pnx-notify-options>
                <button type="button" class="is-active" data-pnx-notify="なし">なし</button>
                <button type="button" data-pnx-notify="当日">当日</button>
                <button type="button" data-pnx-notify="前日">前日</button>
                <button type="button" data-pnx-notify="1週間前">1週間前</button>
              </div>
            </div>
          </div>

          <section class="pnx-cal-color-card" aria-label="予定カラーを選択">
            <div class="pnx-cal-color-top">
              <div>
                <h3>カラー</h3>
                <p>カレンダーに表示するチップ色</p>
              </div>
              <span class="pnx-cal-color-name" data-pnx-color-name>ブルー</span>
            </div>
            <div class="pnx-cal-color-options" data-pnx-color-options>
              <button type="button" class="pnx-cal-color-dot is-selected" data-pnx-color="blue" aria-label="ブルー"><span></span></button>
              <button type="button" class="pnx-cal-color-dot" data-pnx-color="green" aria-label="グリーン"><span></span></button>
              <button type="button" class="pnx-cal-color-dot" data-pnx-color="purple" aria-label="パープル"><span></span></button>
              <button type="button" class="pnx-cal-color-dot" data-pnx-color="orange" aria-label="オレンジ"><span></span></button>
              <button type="button" class="pnx-cal-color-dot" data-pnx-color="red" aria-label="レッド"><span></span></button>
              <button type="button" class="pnx-cal-color-dot" data-pnx-color="gray" aria-label="グレー"><span></span></button>
            </div>
            <div class="pnx-cal-color-preview">
              <span class="pnx-cal-color-preview-label">表示プレビュー</span>
              <span class="pnx-cal-preview-chip" data-pnx-color-preview-chip style="--pnx-chip-color:#0a74ff"><span data-pnx-color-preview-title>新規予定</span></span>
            </div>
          </section>

          <button class="pnx-cal-add-save" type="button" data-pnx-action="save-add">保存する</button>
        </div>
      </section>

            <section class="pnx-cal-date-range-sheet" data-pnx-date-range-sheet aria-hidden="true" role="dialog" aria-modal="true" aria-label="日付と時間を選択">

        <div class="pnx-cal-date-range-head is-wheel-style">

          <button class="pnx-cal-date-range-text-btn is-primary" type="button" data-pnx-action="apply-date-range">完了</button>
        </div>

        <div class="pnx-cal-dt-summary">
          <button type="button" class="pnx-cal-dt-card is-active" data-pnx-dt-field="start">
            <span>開始</span>
            <strong data-pnx-dt-start-summary>5/26(火) 00:00</strong>
          </button>
          <span class="pnx-cal-dt-arrow" aria-hidden="true">→</span>
          <button type="button" class="pnx-cal-dt-card" data-pnx-dt-field="end">
            <span>終了</span>
            <strong data-pnx-dt-end-summary>5/26(火) 00:00</strong>
          </button>
          <button type="button" class="pnx-cal-dt-allday" data-pnx-action="toggle-all-day">終日</button>
        </div>

        <div class="pnx-cal-dt-wheel-area">
          <div class="pnx-cal-dt-wheel-grid">
            <div class="pnx-cal-dt-wheel-col is-date">
              <div class="pnx-cal-dt-wheel" data-pnx-picker-date-list></div>
            </div>
            <div class="pnx-cal-dt-wheel-col is-hour" data-pnx-dt-time-col>
              <div class="pnx-cal-dt-wheel" data-pnx-picker-hour-list></div>
            </div>
            <div class="pnx-cal-dt-wheel-col is-minute" data-pnx-dt-time-col>
              <div class="pnx-cal-dt-wheel" data-pnx-picker-minute-list></div>
            </div>
            <div class="pnx-cal-dt-wheel-highlight" aria-hidden="true"></div>
          </div>
        </div>

            <button type="button" data-pnx-minute-step="60">60</button>
          </div>
        </div>
      </section>
    </div>

    <div class="pnx-cal-detail-layer" data-pnx-detail-layer aria-hidden="true">
      <button class="pnx-cal-detail-backdrop" type="button" data-pnx-action="close-detail" aria-label="閉じる"></button>
      <section class="pnx-cal-detail-sheet" role="dialog" aria-modal="true" aria-labelledby="pnx-detail-title">
        <div class="pnx-cal-detail-handle" aria-hidden="true"></div>
        <div class="pnx-cal-detail-head">
          <button class="pnx-cal-detail-close" type="button" data-pnx-action="close-detail">閉じる</button>
          <h2 id="pnx-detail-title" data-pnx-detail-heading>予定の詳細</h2>
          <span aria-hidden="true"></span>
        </div>

        <div class="pnx-cal-detail-card">
          <div class="pnx-cal-detail-row">
            <span class="pnx-cal-detail-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="16" rx="2.4"/><path d="M8.5 8.5H15.5"/><path d="M8.5 12H15.5"/><path d="M8.5 15.5H13"/></svg></span>
            <span class="pnx-cal-detail-label">タイトル</span>

<script id="pnx-step200-integration-base">
(function(){
  if (window.__PNX_STEP200_INTEGRATION_BASE__) return;
  window.__PNX_STEP200_INTEGRATION_BASE__ = true;

  var MODULE_ROUTES = {
    calendar: { type:"native", label:"カレンダー" },
    search: { type:"iframe", pageId:"pnx-module-search", frameId:"search-module-frame", src:"pages/search/embed.html?v=step203-calendar-link", label:"試合検索" },
    featured: { type:"iframe", pageId:"pnx-module-featured", frameId:"featured-module-frame", src:"pages/featured/embed.html?v=step202-search-fit", label:"広告・注目" },
    finance: { type:"iframe", pageId:"pnx-module-finance", frameId:"finance-module-frame", src:"pages/finance/embed.html?v=step202-search-fit", label:"収支" },
    mypage: { type:"iframe", pageId:"pnx-module-mypage", frameId:"mypage-frame", src:"pages/mypage/embed.html?v=step202-search-fit", label:"マイページ" },
    profile: { type:"iframe", pageId:"pnx-module-profile", frameId:"profile-frame", src:"pages/profile/embed.html?v=step202-search-fit", label:"プロフィール" }
  };

  function normalizePage(page){
    if (!page) return "calendar";
    if (page === "profile-nav") return "mypage";
    if (page === "profile") return "mypage";
    if (page === "profile-detail") return "profile";
    if (page === "ads" || page === "ad") return "featured";
    if (page === "admin" || page === "cms") return "cms";
    return page;
  }

  function getLayer(){ return document.getElementById("pnx-module-layer"); }

  function ensureFrame(route){
    if (!route || route.type !== "iframe") return null;
    var frame = document.getElementById(route.frameId);
    if (!frame) return null;
    frame.setAttribute("data-src", route.src);
    if (!frame.getAttribute("src")) frame.setAttribute("src", route.src);
    return frame;
  }

  function setNavActive(page){
    var navPage = (page === "mypage" || page === "profile") ? "profile" : page;
    document.querySelectorAll("[data-pnx-nav]").forEach(function(item){
      var itemPage = item.getAttribute("data-pnx-nav");
      var on = itemPage === navPage;
      item.classList.toggle("is-active", on);
      if (on) item.setAttribute("aria-current", "page");
      else item.removeAttribute("aria-current");
    });
  }

  function closeCalendarSheets(){
    try {
      document.querySelectorAll("[data-pnx-add-layer],[data-pnx-detail-layer],[data-pnx-date-range-sheet]").forEach(function(el){
        el.setAttribute("aria-hidden","true");
        el.classList.remove("is-open","active","show");
      });
      var pop = document.querySelector("[data-pnx-month-popover]");
      if (pop) pop.setAttribute("aria-hidden","true");
    } catch(e) {}
  }

  function openCMS(){
    var url = "cms/index.html";
    window.__PNX_STEP200_LAST_CMS_OPEN__ = { at:new Date().toISOString(), url:url };
    window.open(url, "_blank", "noopener,noreferrer");
    return true;
  }

  function showPage(rawPage){
    var page = normalizePage(rawPage);

    if (page === "cms") return openCMS();

    var layer = getLayer();

    if (page === "calendar") {
      if (layer) {
        layer.classList.remove("is-open");
        layer.setAttribute("aria-hidden","true");
      }
      document.body.classList.remove("pnx-module-active");
      document.body.dataset.currentPage = "calendar";
      document.querySelectorAll(".pnx-module-page").forEach(function(p){
        p.classList.remove("is-active");
        p.setAttribute("aria-hidden","true");
      });
      setNavActive("calendar");

      try {
        if (typeof window.renderAllPanels === "function") setTimeout(window.renderAllPanels, 30);
        if (typeof window.renderCalList === "function") setTimeout(window.renderCalList, 50);
      } catch(e) {}

      window.__PNX_STEP200_LAST_PAGE__ = { at:new Date().toISOString(), page:"calendar" };
      return true;
    }

    var route = MODULE_ROUTES[page];
    if (!route || route.type !== "iframe") {
      console.warn("[ProNexaX] Unknown page route:", rawPage, page);
      return false;
    }

    if (layer) {
      layer.classList.add("is-open");
      layer.setAttribute("aria-hidden","false");
    }
    document.body.classList.add("pnx-module-active");
    document.body.dataset.currentPage = page;
    closeCalendarSheets();

    document.querySelectorAll(".pnx-module-page").forEach(function(p){
      var on = p.id === route.pageId;
      p.classList.toggle("is-active", on);
      p.setAttribute("aria-hidden", on ? "false" : "true");
    });

    ensureFrame(route);
    setNavActive(page);

    window.__PNX_STEP200_LAST_PAGE__ = { at:new Date().toISOString(), page:page, frameId:route.frameId, src:route.src };
    return true;
  }

  window.ProNexaXSwitchPage = showPage;
  window.switchPage = showPage;
  window.PNXSwitchPage = showPage;

  window.addEventListener("message", function(e){
    var data = e && e.data || {};
    if (data.type === "PNX_SET_PAGE" && data.page) {
      showPage(data.page);
      return;
    }
    if (data.type === "PNX_OPEN_PROFILE" || data.page === "profile-detail") {
      var route = MODULE_ROUTES.profile;
      var layer = getLayer();
      if (layer) {
        layer.classList.add("is-open");
        layer.setAttribute("aria-hidden","false");
      }
      document.body.classList.add("pnx-module-active");
      document.body.dataset.currentPage = "profile";
      document.querySelectorAll(".pnx-module-page").forEach(function(p){
        var on = p.id === route.pageId;
        p.classList.toggle("is-active", on);
        p.setAttribute("aria-hidden", on ? "false" : "true");
      });
      ensureFrame(route);
      setNavActive("mypage");
      return;
    }
    if (data.type === "PNX_PROFILE_BACK_TO_MYPAGE") {
      showPage("mypage");
      return;
    }
    if (data.type === "PNX_OPEN_CMS") {
      openCMS();
      return;
    }
  });

  window.PNXIntegrationRoutes = MODULE_ROUTES;
  window.PNXOpenCMS = openCMS;
  window.PNXStep200IntegrationStatus = function(){
    var layer = getLayer();
    var pages = {};
    Object.keys(MODULE_ROUTES).forEach(function(key){
      var route = MODULE_ROUTES[key];
      pages[key] = route.pageId ? {
        pageExists:!!document.getElementById(route.pageId),
        frameExists:!!document.getElementById(route.frameId),
        frameSrc:document.getElementById(route.frameId)?.getAttribute("src") || null
      } : { native:true };
    });
    return {
      step:"200",
      currentPage:document.body.dataset.currentPage || "calendar",
      moduleLayerExists:!!layer,
      moduleLayerOpen:!!layer && layer.classList.contains("is-open"),
      copiedModules:true,
      routes:pages,
      lastPage:window.__PNX_STEP200_LAST_PAGE__ || null,
      lastCMS:window.__PNX_STEP200_LAST_CMS_OPEN__ || null,
      note:"v4.23カレンダー本体を正にした統合ベース"
    };
  };
})();
</script>

    layer.classList.add("is-open");
    layer.setAttribute("aria-hidden", "false");

    document.querySelectorAll(".pnx-module-page").forEach(function(modulePage){
      var on = modulePage.id === route.pageId;
      modulePage.classList.toggle("is-active", on);
      modulePage.setAttribute("aria-hidden", on ? "false" : "true");
    });

    ensureFrame(route);
    closeCalendarOverlays();
    setNavActive(page);

    window.__PNX_STEP201_LAST_ROUTE__ = {
      at:new Date().toISOString(),
      page:page,
      type:"iframe",
      frameId:route.frameId,
      src:route.src
    };

    return true;
  }

  function showCalendar(){
    var layer = getLayer();

    if (layer) {
      layer.classList.remove("is-open");
      layer.setAttribute("aria-hidden", "true");
    }

    document.body.classList.remove("pnx-module-active", "pnx-step201-module-active");
    document.body.dataset.currentPage = "calendar";

    document.querySelectorAll(".pnx-module-page").forEach(function(modulePage){
      modulePage.classList.remove("is-active");
      modulePage.setAttribute("aria-hidden", "true");
    });

    setNavActive("calendar");

    try {
      if (typeof window.renderAllPanels === "function") setTimeout(window.renderAllPanels, 30);
      if (typeof window.renderCalList === "function") setTimeout(window.renderCalList, 60);
    } catch(e) {}

    window.__PNX_STEP201_LAST_ROUTE__ = {
      at:new Date().toISOString(),
      page:"calendar",
      type:"native"
    };

    return true;
  }

  function openCMS(){
    var url = "cms/index.html";
    window.__PNX_STEP201_LAST_CMS_OPEN__ = {
      at:new Date().toISOString(),
      url:url
    };
    window.open(url, "_blank", "noopener,noreferrer");
    return true;
  }

  function navigate(rawPage, options){
    var page = normalizePage(rawPage);
    options = options || {};

    if (page === "cms") return openCMS();
    if (page === "calendar") return showCalendar();
    if (ROUTES[page] && ROUTES[page].type === "iframe") return setModulePage(page);

    console.warn("[STEP201] Unknown route:", rawPage, page, options);
    return false;
  }

  function bindBottomNav(){
    document.addEventListener("click", function(event){
      var nav = event.target.closest("[data-pnx-nav]");
      if (!nav) return;

      event.preventDefault();
      event.stopPropagation();
      if (typeof event.stopImmediatePropagation === "function") event.stopImmediatePropagation();

      navigate(nav.getAttribute("data-pnx-nav"), { source:"bottom-nav" });
    }, true);
  }

  function bindMessages(){
    window.addEventListener("message", function(event){
      var data = event && event.data || {};

      if (data.type === "PNX_SET_PAGE" && data.page) {
        navigate(data.page, { source:"postMessage" });
        return;
      }

      if (data.type === "PNX_OPEN_PROFILE" || data.page === "profile-detail") {
        navigate("profileDetail", { source:"postMessage" });
        return;
      }

      if (data.type === "PNX_PROFILE_BACK_TO_MYPAGE") {
        navigate("mypage", { source:"postMessage" });
        return;
      }

      if (data.type === "PNX_OPEN_CMS") {
        openCMS();
      }
    });
  }

  function installGlobals(){
    window.PNXSwitchPage = navigate;
    window.ProNexaXSwitchPage = navigate;
    window.switchPage = navigate;

    window.PNXOpenCMS = openCMS;
    window.PNXOpenProfilePage = function(){ return navigate("profileDetail", { source:"global" }); };
    window.PNXOpenMyPage = function(){ return navigate("mypage", { source:"global" }); };

    window.PNXStep201Navigate = navigate;
    window.PNXStep201OpenCMS = openCMS;
  }

  function getRouteState(){
    var layer = getLayer();
    var pages = {};

    Object.keys(ROUTES).forEach(function(key){
      var route = ROUTES[key];
      if (route.type === "native") {
        pages[key] = { native:true };
        return;
      }
      var pageEl = document.getElementById(route.pageId);
      var frame = document.getElementById(route.frameId);
      pages[key] = {
        pageExists:!!pageEl,
        pageActive:!!pageEl && pageEl.classList.contains("is-active"),
        frameExists:!!frame,
        frameSrc:frame ? frame.getAttribute("src") : null,
        display:pageEl ? getComputedStyle(pageEl).display : null,
        ariaHidden:pageEl ? pageEl.getAttribute("aria-hidden") : null
      };
    });

    return {
      layerExists:!!layer,
      layerOpen:!!layer && layer.classList.contains("is-open"),
      layerDisplay:layer ? getComputedStyle(layer).display : null,
      bodyPage:document.body.dataset.currentPage || "calendar",
      bodyModuleActive:document.body.classList.contains("pnx-step201-module-active"),
      pages:pages
    };
  }

  function smokeTest(){
    var required = {
      navCalendar:!!document.querySelector('[data-pnx-nav="calendar"]'),
      navSearch:!!document.querySelector('[data-pnx-nav="search"]'),
      navFeatured:!!document.querySelector('[data-pnx-nav="featured"]'),
      navFinance:!!document.querySelector('[data-pnx-nav="finance"]'),
      navProfile:!!document.querySelector('[data-pnx-nav="profile"]'),
      layer:!!document.getElementById("pnx-module-layer"),
      searchFrame:!!document.getElementById("search-module-frame"),
      featuredFrame:!!document.getElementById("featured-module-frame"),
      financeFrame:!!document.getElementById("finance-module-frame"),
      mypageFrame:!!document.getElementById("mypage-frame"),
      profileFrame:!!document.getElementById("profile-frame")
    };

    var ok = Object.keys(required).every(function(k){ return required[k]; });

    return {
      ok:ok,
      required:required,
      current:getRouteState(),
      lastRoute:window.__PNX_STEP201_LAST_ROUTE__ || null
    };
  }

  bindBottomNav();
  bindMessages();
  installGlobals();
  setTimeout(installGlobals, 0);
  setTimeout(installGlobals, 300);
  setTimeout(installGlobals, 1000);

  window.PNXStep201RouteState = getRouteState;
  window.PNXStep201SmokeTest = smokeTest;
  window.PNXStep201NavStabilityStatus = function(){
    return {
      step:"201",
      cache:CACHE,
      current:getRouteState(),
      smoke:smokeTest(),
      lastRoute:window.__PNX_STEP201_LAST_ROUTE__ || null,
      lastCMS:window.__PNX_STEP201_LAST_CMS_OPEN__ || null,
      note:"v4.23新本体の下部ナビとiframeモジュール切替を安定化"
    };
  };
})();
</script>


<style id="pnx-step202-search-module-fit-final">

#pnx-module-search{

<script id="pnx-step202-search-module-fit-guard">
(function(){
  if (window.__PNX_STEP202_SEARCH_PARENT_FIT__) return;
  window.__PNX_STEP202_SEARCH_PARENT_FIT__ = true;

  var SEARCH_SRC = "pages/search/embed.html?v=step203-calendar-link";

  function ensureSearchFrame(){
    var frame = document.getElementById("search-module-frame");
    if (!frame) return null;
    frame.setAttribute("data-src", SEARCH_SRC);
    if (frame.getAttribute("src") !== SEARCH_SRC) {
      frame.setAttribute("src", SEARCH_SRC);
    }
    return frame;
  }

  function markSearchActive(active){
    document.body.classList.toggle("pnx-step202-search-active", !!active);
  }

  function openSearch(){
    ensureSearchFrame();

    if (typeof window.PNXStep201Navigate === "function") {
      window.PNXStep201Navigate("search", { source:"step202" });
    } else if (typeof window.PNXSwitchPage === "function") {
      window.PNXSwitchPage("search");
    }

    markSearchActive(true);

    var frame = document.getElementById("search-module-frame");
    if (frame && frame.contentWindow) {
      try {
        frame.contentWindow.postMessage({ type:"PNX_SEARCH_RESET_SCROLL", step:"202" }, "*");
      } catch(e) {}
    }

    window.__PNX_STEP202_LAST_SEARCH_OPEN__ = new Date().toISOString();
    return true;
  }

  function observeCurrentPage(){
    var page = document.body.dataset.currentPage || "calendar";
    markSearchActive(page === "search");
  }

  window.addEventListener("message", function(event){
    var data = event && event.data || {};
    if (data.type === "PNX_SEARCH_READY") {
      window.__PNX_STEP202_LAST_SEARCH_READY__ = data;
    }
    if (data.type === "PNX_SET_PAGE" && data.page) {
      setTimeout(observeCurrentPage, 80);
    }
  });

  document.addEventListener("click", function(event){
    var nav = event.target.closest('[data-pnx-nav="search"]');
    if (!nav) return;
    setTimeout(function(){
      ensureSearchFrame();
      observeCurrentPage();
    }, 80);
  }, true);

  var observer = new MutationObserver(observeCurrentPage);
  document.addEventListener("DOMContentLoaded", function(){
    ensureSearchFrame();
    observeCurrentPage();
    observer.observe(document.body, { attributes:true, attributeFilter:["data-current-page", "class"] });
  });

  setTimeout(ensureSearchFrame, 300);
  setTimeout(ensureSearchFrame, 1000);

  window.PNXStep202OpenSearch = openSearch;
  window.PNXStep202EnsureSearchFrame = ensureSearchFrame;
  window.PNXStep202SearchFitStatus = function(){
    var frame = document.getElementById("search-module-frame");
    var page = document.getElementById("pnx-module-search");
    var layer = document.getElementById("pnx-module-layer");
    return {
      step:"202-parent",
      searchFrameExists:!!frame,
      searchFrameSrc:frame ? frame.getAttribute("src") : null,
      searchPageExists:!!page,
      searchPageActive:!!page && page.classList.contains("is-active"),
      searchPageDisplay:page ? getComputedStyle(page).display : null,
      layerOpen:!!layer && layer.classList.contains("is-open"),
      bodyPage:document.body.dataset.currentPage || "calendar",
      searchActiveClass:document.body.classList.contains("pnx-step202-search-active"),
      lastOpen:window.__PNX_STEP202_LAST_SEARCH_OPEN__ || null,
      lastReady:window.__PNX_STEP202_LAST_SEARCH_READY__ || null,
      note:"試合検索モジュールをv4.23本体に合わせて表示調整"
    };
  };
})();
</script>


<script id="pnx-step203-search-calendar-link">
/* STEP203: 試合検索iframe → 本体カレンダー追加連携 */
(function(){
  if (window.__PNX_STEP203_SEARCH_CALENDAR_LINK__) return;
  window.__PNX_STEP203_SEARCH_CALENDAR_LINK__ = true;

  function addTournamentFromMessage(data){
    var tournament = data && data.tournament;
    if (!tournament) return { ok:false, reason:"missing-tournament" };
    if (typeof window.PNXCalendarAddTournamentEvent !== "function") {
      console.warn("[ProNexaX] PNXCalendarAddTournamentEvent is not ready.", tournament);
      return { ok:false, reason:"calendar-api-not-ready" };
    }
    var result = window.PNXCalendarAddTournamentEvent(tournament, { select:true });
    window.__PNX_STEP203_LAST_ADD_RESULT__ = {
      at:new Date().toISOString(),
      tournament:tournament,
      result:result
    };
    return result;
  }

  window.addEventListener("message", function(event){
    var data = event && event.data || {};
    if (data.type !== "PNX_ADD_TOURNAMENT_TO_CALENDAR") return;
    var result = addTournamentFromMessage(data);

    try {
      if (event.source && typeof event.source.postMessage === "function") {
        event.source.postMessage({
          type:"PNX_ADD_TOURNAMENT_TO_CALENDAR_RESULT",
          source:"calendar-parent",
          step:"203",
          at:new Date().toISOString(),
          tournamentId:data.tournament && data.tournament.id,
          ok:!!(result && result.ok),
          duplicate:!!(result && result.duplicate),
          reason:result && result.reason || null
        }, "*");
      }
    } catch(e) {}
  });

  window.PNXStep203AddTournamentFromSearch = addTournamentFromMessage;
  window.PNXStep203SearchCalendarLinkStatus = function(){
    return {
      step:"203",
      installed:true,
      calendarApiReady:typeof window.PNXCalendarAddTournamentEvent === "function",
      lastAdd:window.__PNX_STEP203_LAST_ADD_RESULT__ || null,
      note:"試合検索iframeから本体カレンダーへ大会予定を追加する連携"
    };
  };
})();
</script>
