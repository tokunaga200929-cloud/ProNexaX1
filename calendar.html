<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>ProNexaX Calendar v2</title>
  <link rel="stylesheet" href="calendar.css">
  <style>
    /* 単体プレビュー用。本体統合時はこの style と body/html は使わない */
    html, body {
      margin: 0;
      padding: 0;
      background: #ffffff;
      min-height: 100%;
      -webkit-text-size-adjust: 100%;
    }
    body {
      background: #ffffff;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }
    #page-calendar {
      width: 100%;
      max-width: 430px;
      min-height: 100dvh;
      background: #fff;
      overflow-x: hidden;
      overflow-y: auto;
    }
  </style>
</head>
<body>
<!--
  本体統合時は、ここから </section> までを index.html の page-calendar に入れてください。
  calendar.css と calendar.js は既存本体側で読み込んでください。
-->
<section id="page-calendar" class="page active">
  <div class="pnx-calendar-v2" data-pnx-calendar-v2>
    <header class="pnx-cal-header" aria-label="ProNexaX calendar header">
      <button class="pnx-cal-header-btn pnx-cal-menu-btn" type="button" data-pnx-action="menu" aria-label="メニュー">
        <svg viewBox="0 0 28 28" aria-hidden="true">
          <path d="M5.5 8.2H22.5" />
          <path d="M5.5 14H22.5" />
          <path d="M5.5 19.8H22.5" />
        </svg>
      </button>

      <div class="pnx-cal-brand" aria-label="ProNexaX">
        <img class="pnx-cal-brand-img" src="assets/pronexax-logo-wordmark.png" alt="ProNexaX">
      </div>

      <div class="pnx-cal-actions" aria-label="操作">
        <button class="pnx-cal-header-btn" type="button" data-pnx-action="search" aria-label="検索">
          <svg viewBox="0 0 28 28" aria-hidden="true">
            <circle cx="12.2" cy="12.2" r="7.2" />
            <path d="M17.5 17.5L23 23" />
          </svg>
        </button>
        <button class="pnx-cal-header-btn pnx-cal-bell-btn" type="button" data-pnx-action="notify" aria-label="通知">
          <svg viewBox="0 0 28 28" aria-hidden="true">
            <path d="M8.2 13.1C8.2 9.3 10.8 6.5 14 6.5C17.2 6.5 19.8 9.3 19.8 13.1V16.4C19.8 17.4 20.4 18.3 21.2 18.9L21.8 19.3H6.2L6.8 18.9C7.7 18.3 8.2 17.4 8.2 16.4V13.1Z" />
            <path d="M11.8 22C12.3 22.9 13 23.4 14 23.4C15 23.4 15.7 22.9 16.2 22" />
            <path d="M14 4.3V6.4" />
          </svg>
          <span class="pnx-cal-bell-dot" aria-hidden="true"></span>
        </button>
        <button class="pnx-cal-add-btn" type="button" data-pnx-action="add" aria-label="予定を追加">
          <svg viewBox="0 0 28 28" aria-hidden="true">
            <path d="M14 7V21" />
            <path d="M7 14H21" />
          </svg>
        </button>
      </div>
    </header>

    <div class="pnx-cal-monthbar" aria-label="月切り替え">
      <button class="pnx-cal-month-nav" type="button" data-pnx-action="prev-month" aria-label="前の月">
        <svg viewBox="0 0 28 28" aria-hidden="true"><path d="M17 7.5L10.5 14L17 20.5" /></svg>
      </button>
      <button class="pnx-cal-month-label" type="button" data-pnx-action="pick-month" aria-label="月を選択">
        <span data-pnx-month-label>2026年 5月</span>
        <svg viewBox="0 0 28 28" aria-hidden="true"><path d="M9 11.5L14 16.5L19 11.5" /></svg>
      </button>
      <button class="pnx-cal-month-nav" type="button" data-pnx-action="next-month" aria-label="次の月">
        <svg viewBox="0 0 28 28" aria-hidden="true"><path d="M11 7.5L17.5 14L11 20.5" /></svg>
      </button>
    </div>

    <div class="pnx-cal-weekdays" aria-hidden="true">
      <div class="is-sun">日</div>
      <div>月</div>
      <div>火</div>
      <div>水</div>
      <div>木</div>
      <div>金</div>
      <div class="is-sat">土</div>
    </div>

    <div class="pnx-cal-grid" data-pnx-grid aria-label="月間カレンダー"></div>

    <section class="pnx-cal-sheet" aria-label="選択日の予定">
      <div class="pnx-cal-sheet-handle" aria-hidden="true"></div>
      <div class="pnx-cal-sheet-toolbar">
        <div class="pnx-cal-sheet-left">
          <div class="pnx-cal-date-pill" data-pnx-sheet-date>5月20日（水）</div>
          <button class="pnx-cal-today-pill" type="button" data-pnx-action="today">今日</button>
        </div>
        <div class="pnx-cal-sheet-tools">
          <button class="pnx-cal-tool-btn" type="button" data-pnx-action="day-view">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="4.3" y="5.4" width="15.4" height="15" rx="2.2" />
              <path d="M4.3 10H19.7" />
              <path d="M8.3 3.8V7" />
              <path d="M15.7 3.8V7" />
            </svg>
            <span>日表示</span>
          </button>
          <button class="pnx-cal-tool-btn" type="button" data-pnx-action="filter">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4.5 7H19.5" />
              <path d="M7.5 12H16.5" />
              <path d="M10.5 17H13.5" />
            </svg>
            <span>絞り込み</span>
          </button>
        </div>
      </div>
      <div class="pnx-cal-event-list" data-pnx-sheet-list></div>
    </section>

    <nav class="pnx-cal-bottom-nav" aria-label="メインナビゲーション">
      <button class="pnx-cal-nav-item is-active" type="button" data-pnx-nav="calendar" aria-current="page">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="4" y="5" width="16" height="15" rx="2.5" />
          <path d="M4 9H20" />
          <path d="M8 3.5V6.5" />
          <path d="M16 3.5V6.5" />
        </svg>
        <span>カレンダー</span>
      </button>
      <button class="pnx-cal-nav-item" type="button" data-pnx-nav="search">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="10.5" cy="10.5" r="6.5" />
          <path d="M15.5 15.5L20.5 20.5" />
        </svg>
        <span>試合検索</span>
      </button>
      <button class="pnx-cal-nav-item" type="button" data-pnx-nav="featured">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 4.2L14.35 8.95L19.6 9.72L15.8 13.42L16.7 18.65L12 16.18L7.3 18.65L8.2 13.42L4.4 9.72L9.65 8.95L12 4.2Z" />
        </svg>
        <span>広告</span>
      </button>
      <button class="pnx-cal-nav-item" type="button" data-pnx-nav="finance">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M5 18.5H19" />
          <path d="M6.5 16L10.4 12.1L13.2 14.3L18 8" />
          <path d="M18 8V12" />
          <path d="M18 8H14" />
        </svg>
        <span>収支</span>
      </button>
      <button class="pnx-cal-nav-item" type="button" data-pnx-nav="profile">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="8" r="4" />
          <path d="M4.8 20C5.6 16.8 8.3 15 12 15C15.7 15 18.4 16.8 19.2 20" />
        </svg>
        <span>マイページ</span>
      </button>
    </nav>
  </div>
</section>

<script src="calendar.js" charset="UTF-8"></script>
<script>
  if (window.initProNexaCalendarV2) window.initProNexaCalendarV2();
</script>
</body>
</html>
