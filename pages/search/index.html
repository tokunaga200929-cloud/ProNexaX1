<script id="pnx-step180h-iframe-nav-bridge">
(function(){
  if (window.__PNX_STEP180H_IFRAME_NAV_BRIDGE__) return;
  window.__PNX_STEP180H_IFRAME_NAV_BRIDGE__ = true;

  function send(page){
    try {
      window.parent.postMessage({ type:"PNX_SET_PAGE", page:page, source:"iframe-nav-bridge" }, "*");
    } catch(e) {}
  }

  document.addEventListener("click", function(e){
    var trigger = e.target && e.target.closest && e.target.closest("[data-page], [data-target], [data-tab], [href]");
    if (!trigger) return;
    var page = trigger.getAttribute("data-page") || trigger.getAttribute("data-target") || trigger.getAttribute("data-tab") || "";
    var href = trigger.getAttribute("href") || "";
    if (href === "#mypage" || href === "#page-mypage") page = "mypage";
    if (["calendar","search","featured","finance","mypage"].indexOf(page) === -1) return;
    e.preventDefault();
    e.stopPropagation();
    if (typeof e.stopImmediatePropagation === "function") e.stopImmediatePropagation();
    send(page);
  }, true);

  window.PNXStep180hIframeNavBridgeStatus = function(){
    return { step:"180h", bridge:true, href:location.href };
  };
})();
</script>
