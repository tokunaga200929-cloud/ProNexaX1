<!DOCTYPE html>
<!--
  ProNexaX — 注目（feature）ページ  index.html
  ================================================================
  【本体統合時の作業メモ】
  1. <header class="page-header"> の内容を本体の注目セクションに移植
  2. バナー・カテゴリ・記事・プロモの各 <section> を本体に移植
  3. <nav class="bottom-nav"> は本体の共通ナビと置き換える
  4. <link rel="stylesheet" href="../../styles/featured/featured.css"> のパスを調整
  5. <script src="../../scripts/featured/featured.js"> のパスを調整し、
     navigateToFeature() と initBottomNav() を本体ロジックと接続

  【画像差し替え一覧】（パスは本体側に合わせて変更）
    Pロゴアイコン   ../../assets/images/p-tab-icon.png
    バナー 1〜3枚目 ../../assets/images/feature-hero-1〜3.jpg
    記事 サムネイル  ../../assets/images/article-driver / article-course / article-lesson .jpg
  ================================================================
-->
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>注目 — ProNexaX</title>
  <link rel="stylesheet" href="../../styles/featured/featured.css">

  <style>
    /* ProNexaX本体統合用：注目/広告をiframe内で全画面表示 */
    html, body {
      margin: 0 !important;
      width: 100%;
      min-width: 100%;
      height: 100%;
      min-height: 100dvh;
      background: #F2F2F7 !important;
      overflow: hidden !important;
    }
    nav.bottom-nav,
    .bottom-nav {
      display: none !important;
    }
    body {
      display: block !important;
    }
    body > *:first-child {
      min-height: 100dvh !important;
    }
  </style>


  <style>
    /* STEP4 featured embed stability */
    html, body {
      margin: 0 !important;
      width: 100% !important;
      height: 100% !important;
      min-height: 100dvh !important;
      overflow: hidden !important;
      background: #F2F2F7 !important;
    }
    nav.bottom-nav,
    .bottom-nav {
      display: none !important;
    }
    body > *:first-child {
      min-height: 100dvh !important;
    }
  </style>


  <style id="pnx-step210-featured-scroll-fix">
    /* STEP210: iframe内で注目/広告ページを縦スクロールできるように固定 */
    html, body {
      height: 100% !important;
      min-height: 0 !important;
      overflow: hidden !important;
      background: #F2F2F7 !important;
    }
    .app-wrapper {
      height: 100dvh !important;
      min-height: 0 !important;
      max-height: 100dvh !important;
      overflow: hidden !important;
    }
    .scroll-content {
      flex: 1 1 auto !important;
      min-height: 0 !important;
      height: 100% !important;
      max-height: 100% !important;
      overflow-y: auto !important;
      overflow-x: hidden !important;
      -webkit-overflow-scrolling: touch !important;
      overscroll-behavior-y: contain !important;
      touch-action: pan-y !important;
      padding-bottom: calc(28px + env(safe-area-inset-bottom, 0px)) !important;
    }
    body > *:first-child {
      height: 100dvh !important;
      min-height: 0 !important;
      max-height: 100dvh !important;
    }
  </style>

  <script src="../../scripts/disable-zoom.js" defer></script>
</head>
<body>

<div class="app-wrapper">
  <div class="scroll-content">

    <!-- ============================================================
         [1] HEADER
         sticky ヘッダー。スクロール時に JS が .scrolled を付与し
         frosted glass に変化する（script.js: initHeaderScroll）
         ============================================================ -->
    <header class="page-header">
      <div class="header-text">
        <h1 class="header-title">注目</h1>
        <p class="header-sub">PICK UPやウェア特集をチェック</p>
      </div>
      <div class="header-actions">
        <button class="header-icon-btn" aria-label="通知">
          <span class="notif-dot"></span>
          <svg width="18" height="18" viewBox="0 0 22 22" fill="none"
               stroke="#6077A6" stroke-width="1.7"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M11 2a7 7 0 0 1 7 7v3l1.5 2.5H2.5L4 12V9a7 7 0 0 1 7-7z"/>
            <path d="M9 19a2 2 0 0 0 4 0"/>
          </svg>
        </button>
        <button class="header-icon-btn" aria-label="検索">
          <svg width="17" height="17" viewBox="0 0 22 22" fill="none"
               stroke="#6077A6" stroke-width="1.7"
               stroke-linecap="round" stroke-linejoin="round">
            <circle cx="10" cy="10" r="6.5"/>
            <line x1="15" y1="15" x2="20" y2="20"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- ============================================================
         [2] MAIN BANNER（自動スライド）
         .banner-bg-1〜3 の background-image に画像を指定するだけで反映。
         スライド制御: script.js initBannerSlider
         ============================================================ -->
    <section class="banner-section" data-pnx-feature-section="pickup">
      <div class="banner-card" role="img" aria-label="メインバナー">

        <!-- 背景スライド 1〜3（画像は CSS の .banner-bg-1〜3 で指定） -->
        <div class="banner-bg banner-bg-1"></div>
        <div class="banner-bg banner-bg-2"></div>
        <div class="banner-bg banner-bg-3"></div>

        <!-- テキスト可読性オーバーレイ（左→右 + 下→上 の2層グラデーション） -->
        <div class="banner-overlay"></div>

        <!-- バナーテキスト・ボタン -->
        <div class="banner-content">
          <span class="banner-label" data-pnx-pickup-label>PICK UP</span>
          <h2 class="banner-title" data-pnx-pickup-title>春の新作ウェア特集</h2>
          <p class="banner-desc" data-pnx-pickup-subtitle>今シーズン注目のウェアやPR情報を<br>青基調で見やすくまとめました</p>
          <button class="banner-btn" data-pnx-pickup-cta-wrap>
            <span data-pnx-pickup-cta>詳しく見る</span>
            <svg class="banner-btn-arrow" viewBox="0 0 14 14" fill="none"
                 stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <polyline points="4,3 10,7 4,11"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- スライダードット（JS で active クラスを切替） -->
      <div class="banner-dots" role="tablist" aria-label="スライド切替">
        <span class="dot active" role="tab" aria-selected="true"  tabindex="0"></span>
        <span class="dot"        role="tab" aria-selected="false" tabindex="0"></span>
        <span class="dot"        role="tab" aria-selected="false" tabindex="0"></span>
      </div>
    </section>

    <!-- ============================================================
         [3] CATEGORY（横スクロール）
         カテゴリは .cat-card を追加するだけで増やせる
         ============================================================ -->
    <section class="section" data-pnx-feature-section="categories">
      <div class="section-header">
        <h2 class="section-title">カテゴリから探す</h2>
      </div>
      <div class="category-scroll-wrap">
        <div class="category-row">

          <button class="cat-card">
            <div class="cat-icon">
              <svg viewBox="0 0 22 22">
                <path d="M8 2L5 5l-3 2 2 3 3-1v9h8V9l3 1 2-3-3-2-3-3"/>
                <line x1="8" y1="2" x2="11" y2="5"/>
                <line x1="14" y1="2" x2="11" y2="5"/>
              </svg>
            </div>
            <span class="cat-label">ウェア</span>
          </button>

          <button class="cat-card">
            <div class="cat-icon">
              <svg viewBox="0 0 22 22">
                <line x1="5" y1="4" x2="15" y2="18"/>
                <path d="M15 18 Q17 19 18 17 Q17 14 15 15"/>
                <circle cx="6" cy="5" r="2"/>
              </svg>
            </div>
            <span class="cat-label">クラブ</span>
          </button>

          <button class="cat-card">
            <div class="cat-icon">
              <svg viewBox="0 0 22 22">
                <path d="M3 18 Q11 10 19 14"/>
                <line x1="13" y1="4" x2="13" y2="14"/>
                <path d="M13 4 L18 7 L13 10"/>
              </svg>
            </div>
            <span class="cat-label">ゴルフ場</span>
          </button>

          <button class="cat-card">
            <div class="cat-icon">
              <svg viewBox="0 0 22 22">
                <rect x="2" y="5" width="18" height="13" rx="2.5"/>
                <polygon points="9,9 9,14 15,11.5" fill="var(--green-dark)" stroke="none"/>
              </svg>
            </div>
            <span class="cat-label">レッスン</span>
          </button>

          <button class="cat-card">
            <div class="cat-icon">
              <svg viewBox="0 0 22 22">
                <rect x="3" y="3" width="16" height="16" rx="2.5"/>
                <line x1="7" y1="8"  x2="15" y2="8"/>
                <line x1="7" y1="11" x2="15" y2="11"/>
                <line x1="7" y1="14" x2="11" y2="14"/>
              </svg>
            </div>
            <span class="cat-label">ニュース</span>
          </button>

        </div>
      </div>
    </section>


    <!-- ============================================================
         [4] WEAR FEATURE（ウェア特集）
         今の注目ページをベースに、ウェアを見つけやすい専用導線を追加
         ============================================================ -->
    <section class="section wear-section" data-pnx-feature-section="wear">
      <div class="section-header wear-section-header">
        <div>
          <h2 class="section-title">ウェア特集</h2>
          <p class="wear-section-sub">季節やシーンごとに見つけやすく整理</p>
        </div>
        <button class="section-more">すべて見る</button>
      </div>

      <div class="wear-chip-row" aria-label="ウェア特集カテゴリ">
        <button class="wear-chip is-active">春夏</button>
        <button class="wear-chip">UV対策</button>
        <button class="wear-chip">レイン</button>
        <button class="wear-chip">レディース</button>
      </div>

      <div class="wear-feature-grid">
        <button class="wear-card wear-card-main" data-pnx-wear-card="0">
          <div class="wear-card-overlay"></div>
          <div class="wear-card-body">
            <span class="wear-card-tag">MAIN PICK UP</span>
            <p class="wear-card-title">春夏の主役ウェア</p>
            <p class="wear-card-desc">軽さ・通気性・動きやすさで選ぶ今季の注目アイテム</p>
            <span class="wear-card-link">特集を見る</span>
          </div>
        </button>

        <div class="wear-side-stack">
          <button class="wear-card wear-card-sub wear-card-uv" data-pnx-wear-card="1">
            <div class="wear-card-overlay"></div>
            <div class="wear-card-body">
              <span class="wear-card-tag">UV CARE</span>
              <p class="wear-card-title">日差し対策</p>
              <p class="wear-card-desc">長袖インナーやアームカバーをチェック</p>
            </div>
          </button>

          <button class="wear-card wear-card-sub wear-card-rain" data-pnx-wear-card="2">
            <div class="wear-card-overlay"></div>
            <div class="wear-card-body">
              <span class="wear-card-tag">RAIN ROUND</span>
              <p class="wear-card-title">雨の日ウェア</p>
              <p class="wear-card-desc">撥水アウターや替えアイテムをまとめて確認</p>
            </div>
          </button>
        </div>
      </div>
    </section>


    <!-- ============================================================
         [5] SPONSOR / PR（スポンサー・PR）
         広告感を強くしすぎず、注目コンテンツの一部として自然に見せる
         ============================================================ -->
    <section class="section sponsor-section" data-pnx-feature-section="sponsor">
      <div class="section-header sponsor-section-header">
        <div>
          <h2 class="section-title">スポンサー・PR</h2>
          <p class="sponsor-section-sub">ゴルファーに役立つサービスやアイテム</p>
        </div>
        <button class="section-more">もっと見る</button>
      </div>

      <div class="sponsor-scroll-wrap">
        <div class="sponsor-row">
          <button class="sponsor-card sponsor-card--brand" data-pnx-pr-card="0">
            <span class="sponsor-badge">PR</span>
            <div class="sponsor-card-icon" data-pnx-pr-visual>W</div>
            <div class="sponsor-card-body">
              <p class="sponsor-card-brand-name">WEAR SELECT</p>
              <p class="sponsor-card-title">人気ウェアをまとめて比較</p>
              <p class="sponsor-card-desc">機能性・デザイン・価格帯から今季の注目モデルをチェック</p>
            </div>
            <span class="sponsor-card-link">見る</span>
          </button>

          <button class="sponsor-card sponsor-card-lesson" data-pnx-pr-card="1">
            <span class="sponsor-badge">PR</span>
            <div class="sponsor-card-icon" data-pnx-pr-visual>L</div>
            <div class="sponsor-card-body">
              <p class="sponsor-card-brand-name">LESSON PASS</p>
              <p class="sponsor-card-title">体験レッスンを探す</p>
              <p class="sponsor-card-desc">インドア・屋外レッスンをエリア別に比較しやすく紹介</p>
            </div>
            <span class="sponsor-card-link">探す</span>
          </button>

          <button class="sponsor-card sponsor-card-travel" data-pnx-pr-card="2">
            <span class="sponsor-badge">PR</span>
            <div class="sponsor-card-icon" data-pnx-pr-visual>T</div>
            <div class="sponsor-card-body">
              <p class="sponsor-card-brand-name">TOUR & STAY</p>
              <p class="sponsor-card-title">遠征・宿泊プラン特集</p>
              <p class="sponsor-card-desc">試合やラウンド遠征に役立つ移動・宿泊情報をピックアップ</p>
            </div>
            <span class="sponsor-card-link">特集へ</span>
          </button>
        </div>
      </div>
    </section>

    <!-- ============================================================
         [4] ARTICLES（注目記事リスト）
         .article-card を複製して記事を追加できる。
         サムネイル画像は CSS の .article-thumb-1〜3 で指定。
         ============================================================ -->
    <section class="section" data-pnx-feature-section="articles">
      <div class="section-header">
        <h2 class="section-title">ゴルファー向け記事</h2>
        <button class="section-more">もっと見る</button>
      </div>

      <div class="article-list">

        <!-- 記事 1 — サムネイル: ../../assets/images/article-driver.jpg -->
        <button class="article-card" data-pnx-article-card="0">
          <div class="article-thumb">
            <div class="article-thumb-img article-thumb-1"></div>
          </div>
          <div class="article-body">
            <div class="article-meta">
              <span class="article-badge">NEW</span>
              <span class="article-date">2025.5.12</span>
            </div>
            <p class="article-title">最新ドライバー徹底比較<br>2025年春モデル</p>
            <p class="article-desc">今季注目の新作ドライバー5本をプロが実打比較</p>
          </div>
          <svg class="article-arrow" width="8" height="14" viewBox="0 0 8 14"
               fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
            <polyline points="1,1 7,7 1,13"/>
          </svg>
        </button>

        <!-- 記事 2 — サムネイル: ../../assets/images/article-course.jpg -->
        <button class="article-card" data-pnx-article-card="1">
          <div class="article-thumb">
            <div class="article-thumb-img article-thumb-2"></div>
          </div>
          <div class="article-body">
            <div class="article-meta">
              <span class="article-badge">NEW</span>
              <span class="article-date">2025.5.10</span>
            </div>
            <p class="article-title">今週末に行きたい<br>おすすめゴルフ場特集</p>
            <p class="article-desc">関東・関西の絶景コース5選をご紹介</p>
          </div>
          <svg class="article-arrow" width="8" height="14" viewBox="0 0 8 14"
               fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
            <polyline points="1,1 7,7 1,13"/>
          </svg>
        </button>

        <!-- 記事 3 — サムネイル: ../../assets/images/article-lesson.jpg -->
        <button class="article-card" data-pnx-article-card="2">
          <div class="article-thumb">
            <div class="article-thumb-img article-thumb-3"></div>
          </div>
          <div class="article-body">
            <div class="article-meta">
              <!-- バッジカラーを変える場合は style で上書き -->
              <span class="article-badge" style="background:#6077A6;">TIPS</span>
              <span class="article-date">2025.5.8</span>
            </div>
            <p class="article-title">プロが教える<br>アプローチの基本</p>
            <p class="article-desc">距離感と方向性を同時に鍛える練習法</p>
          </div>
          <svg class="article-arrow" width="8" height="14" viewBox="0 0 8 14"
               fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
            <polyline points="1,1 7,7 1,13"/>
          </svg>
        </button>

      </div>
    </section>

    <!-- ============================================================
         [5] PROMO BANNER（おすすめギア等）
         ============================================================ -->
    <section class="promo-section" data-pnx-feature-section="bottomPromo">
      <button class="promo-card" style="width:100%;text-align:left;">
        <div class="promo-text-wrap">
          <span class="promo-tag">WEAR PICK UP</span>
          <p class="promo-title">春夏ウェアは<br>軽さと動きやすさで選ぶ</p>
          <p class="promo-sub">人気ブランドの注目アイテムをまとめてチェック</p>
        </div>
        <div class="promo-btn-wrap">
          <span class="promo-action-btn">特集を見る</span>
        </div>
      </button>
    </section>

    <!-- 最下部余白（scroll-content の padding-bottom と併用） -->
    <div class="page-end-spacer"></div>

  </div><!-- /.scroll-content -->

  <!-- ============================================================
       [6] BOTTOM TAB NAV
       ★ 本体統合時: この <nav> ブロック全体を本体の共通ナビと置き換える
       　 中央Pロゴ(#nav-center)のタップ処理は script.js の
       　 navigateToFeature() に実装する
       ============================================================ -->
  <nav class="bottom-nav" aria-label="メインナビゲーション">

    <button class="bnav-btn" aria-label="カレンダー">
      <svg width="20" height="20" viewBox="0 0 22 22" fill="none"
           stroke="#9AA8C2" stroke-width="1.7" stroke-linecap="round">
        <rect x="3" y="4" width="16" height="15" rx="2.5"/>
        <line x1="7" y1="2" x2="7" y2="6"/>
        <line x1="15" y1="2" x2="15" y2="6"/>
        <line x1="3" y1="9" x2="19" y2="9"/>
      </svg>
      <span class="bnav-label">カレンダー</span>
    </button>

    <button class="bnav-btn" aria-label="試合検索">
      <svg width="20" height="20" viewBox="0 0 22 22" fill="none"
           stroke="#9AA8C2" stroke-width="1.7" stroke-linecap="round">
        <circle cx="10" cy="10" r="6"/>
        <line x1="14.5" y1="14.5" x2="19" y2="19"/>
      </svg>
      <span class="bnav-label">試合</span>
    </button>

    <!-- 中央Pロゴタブ — 画像: ../../assets/images/p-tab-icon.png
         画像が読み込めない場合は .p-tab-fallback（白丸+P文字）を表示 -->
    <button class="bnav-btn center-tab" id="nav-center" aria-label="ProNexaX 注目">
      <img class="p-tab-icon"
           src="../../assets/images/p-tab-icon.png"
           alt="P"
           onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
      <span class="p-tab-fallback" style="display:none;">P</span>
    </button>

    <button class="bnav-btn" aria-label="収支">
      <svg width="20" height="20" viewBox="0 0 22 22" fill="none"
           stroke="#9AA8C2" stroke-width="1.7" stroke-linecap="round">
        <rect x="3" y="5" width="16" height="12" rx="2"/>
        <line x1="7"  y1="11" x2="15" y2="11"/>
        <line x1="11" y1="8"  x2="11" y2="14"/>
      </svg>
      <span class="bnav-label">収支</span>
    </button>

    <button class="bnav-btn" aria-label="マイページ">
      <svg width="20" height="20" viewBox="0 0 22 22" fill="none"
           stroke="#9AA8C2" stroke-width="1.7" stroke-linecap="round">
        <circle cx="11" cy="8" r="3.5"/>
        <path d="M4 19c0-3.314 3.134-6 7-6s7 2.686 7 6"/>
      </svg>
      <span class="bnav-label">マイページ</span>
    </button>

  </nav>

</div><!-- /.app-wrapper -->

<script src="../../scripts/featured/featured.js"></script>
</body>
</html>
