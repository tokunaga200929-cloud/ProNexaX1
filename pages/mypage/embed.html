<!doctype html>
<html lang="ja" class="mypage-embed">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>ProNexaX マイページ</title>
  <link rel="stylesheet" href="../../styles/mypage/mypage.css?v=step182f-center-p-single">
</head>
<body class="mypage-embed">
<section id="mypage-root" class="mypage-root pnx-step180c-user-mypage-root" data-mypage-module="true">
<section id="pnx-mypage-screen" class="pnx-mypage-screen">

    <!-- Title -->
    
      <h1 class="pnx-mypage-title">マイページ</h1>
<main class="pnx-mypage-main">

      <!-- 1. Profile card -->
      <button type="button" class="pnx-mypage-profile" data-myPage-action="profile" data-profile-open="true" data-action="profile" data-mypage-action="profile">
        <div class="pnx-mypage-avatar" aria-hidden="true">
          <svg viewBox="0 0 64 64" width="56" height="56" fill="none">
            <circle cx="32" cy="24" r="11" fill="#C9D1E0"/>
            <path d="M12 56c0-11 9-18 20-18s20 7 20 18" fill="#C9D1E0"/>
          </svg>
        </div>
        <div class="pnx-mypage-profile-info">
          <div class="pnx-mypage-profile-name">徳永 圭祐</div>
          <div class="pnx-mypage-profile-email">keisuke@example.com</div>
          <div class="pnx-mypage-badge pnx-mypage-badge--free">FREE</div>
        </div>
        <span class="pnx-mypage-chevron" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="9 6 15 12 9 18"/>
          </svg>
        </span>
      </button>

      <!-- 2. Menu group 1 -->
      <div class="pnx-mypage-card pnx-mypage-list">

        <button type="button" class="pnx-mypage-row" data-myPage-action="favorites">
          <span class="pnx-mypage-row-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="12 3 14.9 9.3 22 10.1 16.8 14.9 18.3 22 12 18.3 5.7 22 7.2 14.9 2 10.1 9.1 9.3 12 3"/>
            </svg>
          </span>
          <span class="pnx-mypage-row-label">お気に入り大会</span>
          <span class="pnx-mypage-chevron" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"/></svg>
          </span>
        </button>

        <button type="button" class="pnx-mypage-row" data-myPage-action="notifications">
          <span class="pnx-mypage-row-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M6 9a6 6 0 1 1 12 0c0 5 2 6.5 2 6.5H4S6 14 6 9z"/>
              <path d="M10.3 19.5a2 2 0 0 0 3.4 0"/>
            </svg>
          </span>
          <span class="pnx-mypage-row-label">通知設定</span>
          <span class="pnx-mypage-chevron" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"/></svg>
          </span>
        </button>

        <button type="button" class="pnx-mypage-row" data-myPage-action="category">
          <span class="pnx-mypage-row-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3.5" y="3.5" width="7" height="7" rx="1.4"/>
              <rect x="13.5" y="3.5" width="7" height="7" rx="1.4"/>
              <rect x="3.5" y="13.5" width="7" height="7" rx="1.4"/>
              <rect x="13.5" y="13.5" width="7" height="7" rx="1.4"/>
            </svg>
          </span>
          <span class="pnx-mypage-row-label">表示カテゴリ設定</span>
          <span class="pnx-mypage-chevron" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"/></svg>
          </span>
        </button>

        <button type="button" class="pnx-mypage-row" data-myPage-action="account">
          <span class="pnx-mypage-row-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="8" r="3.6"/>
              <path d="M5 20c0-3.7 3.1-6.5 7-6.5s7 2.8 7 6.5"/>
            </svg>
          </span>
          <span class="pnx-mypage-row-label">アカウント設定</span>
          <span class="pnx-mypage-chevron" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"/></svg>
          </span>
        </button>
      </div>

      <!-- 3. PRO plan row -->
      <button type="button" class="pnx-mypage-pro" data-myPage-action="pro">
        <span class="pnx-mypage-row-icon pnx-mypage-row-icon--pro" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
            <path d="M3 7.5l4.5 3.5L12 5l4.5 6L21 7.5 19.2 18H4.8L3 7.5z"/>
            <rect x="4.5" y="18.5" width="15" height="2.2" rx="1"/>
          </svg>
        </span>
        <span class="pnx-mypage-pro-label">PROプラン</span>
        <span class="pnx-mypage-pro-cta">アップグレード</span>
        <span class="pnx-mypage-chevron pnx-mypage-chevron--pro" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"/></svg>
        </span>
      </button>

      <!-- 4. Menu group 2 -->
      <div class="pnx-mypage-card pnx-mypage-list">

        <button type="button" class="pnx-mypage-row" data-myPage-action="contact">
          <span class="pnx-mypage-row-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="5.5" width="18" height="13" rx="2"/>
              <path d="M3.5 6.5l8.5 6.5 8.5-6.5"/>
            </svg>
          </span>
          <span class="pnx-mypage-row-label">お問い合わせ</span>
          <span class="pnx-mypage-chevron" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"/></svg>
          </span>
        </button>

        <button type="button" class="pnx-mypage-row pnx-mypage-row--danger" data-myPage-action="logout">
          <span class="pnx-mypage-row-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h8"/>
              <polyline points="14 8 20 12 14 16"/>
              <line x1="10" y1="12" x2="20" y2="12"/>
            </svg>
          </span>
          <span class="pnx-mypage-row-label">ログアウト</span>
          <span class="pnx-mypage-chevron" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"/></svg>
          </span>
        </button>
      </div>

      <!-- 5. Logo -->
      <div class="pnx-mypage-logo">
        <div class="pnx-mypage-logo-mark">
          <span class="pnx-mypage-logo-pron">ProNexa</span><span class="pnx-mypage-logo-x">X</span>
        </div>
        <div class="pnx-mypage-logo-tag">スポーツで、もっとつながる。</div>
      </div>

    </main>

    <!-- standalone bottom nav start -->
    
    <!-- standalone bottom nav end -->

  </section>
</section>
  <script src="../../scripts/mypage/mypage.js?v=step182f-center-p-single"></script>
</body>
</html>
