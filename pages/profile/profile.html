<!doctype html>
<html lang="ja" class="profile-embed">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>プロフィール | ProNexaX</title>
  <link rel="stylesheet" href="../../styles/profile/profile.css?v=step182f-center-p-single">
  <script src="../../scripts/disable-zoom.js" defer></script>
</head>
<body class="profile-embed">
<section id="pnx-profile-screen" class="pnx-profile-screen">
  <!-- 1. ヘッダー -->
  <header class="pnx-profile-header">
    <button class="pnx-profile-header__back" type="button" aria-label="戻る" data-action="back" data-pnx-profile-back="true" onclick="return window.PNXStep182cProfileBack && window.PNXStep182cProfileBack(event)">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <polyline points="15 6 9 12 15 18"></polyline>
      </svg>
    </button>
    <h1 class="pnx-profile-header__title">プロフィール</h1>
    <button class="pnx-profile-header__edit" type="button" data-action="edit">編集</button>
  </header>

  <main class="pnx-profile-main">

    <!-- 2. プロフィールカード -->
    <div class="pnx-profile-card pnx-profile-userCard">
      <div class="pnx-profile-userCard__top">
        <div class="pnx-profile-avatar" aria-hidden="true">
          <svg viewBox="0 0 64 64" width="56" height="56" fill="#B6C2D4" aria-hidden="true">
            <circle cx="32" cy="24" r="11"></circle>
            <path d="M10 58c0-12 10-20 22-20s22 8 22 20v2H10v-2z"></path>
          </svg>
        </div>
        <div class="pnx-profile-userCard__info">
          <p class="pnx-profile-userCard__name">徳永 圭祐</p>
          <p class="pnx-profile-userCard__email">keisuke@example.com</p>
          <span class="pnx-profile-badge pnx-profile-badge--free">FREE</span>
        </div>
      </div>
      <div class="pnx-profile-userCard__divider"></div>
      <div class="pnx-profile-userCard__action">
        <button class="pnx-profile-outlineBtn" type="button" data-action="change-image">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="4" width="18" height="16" rx="2"></rect>
            <circle cx="9" cy="10" r="2"></circle>
            <path d="M21 17l-5-5L5 20"></path>
          </svg>
          <span>プロフィール画像を変更</span>
        </button>
      </div>
    </div>

    <!-- 3. プランカード -->
    <div class="pnx-profile-planCard">
      <div class="pnx-profile-planCard__iconWrap" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="#FFFFFF" aria-hidden="true">
          <path d="M3 7l4 3 5-6 5 6 4-3v11H3V7zm0 13h18v1H3v-1z"></path>
        </svg>
      </div>
      <div class="pnx-profile-planCard__text">
        <p class="pnx-profile-planCard__label">プラン</p>
        <p class="pnx-profile-planCard__value">FREE</p>
      </div>
      <button class="pnx-profile-planCard__cta" type="button" data-action="view-pro">PROを見る</button>
    </div>

    <!-- 4. 基本情報カード -->
    <section class="pnx-profile-card pnx-profile-listCard">
      <h2 class="pnx-profile-listCard__title">基本情報</h2>
      <ul class="pnx-profile-list">
        <li class="pnx-profile-list__row" data-row="name" tabindex="0">
          <span class="pnx-profile-list__label">名前</span>
          <span class="pnx-profile-list__value">徳永 圭祐</span>
          <span class="pnx-profile-list__chevron" aria-hidden="true"></span>
        </li>
        <li class="pnx-profile-list__row" data-row="email" tabindex="0">
          <span class="pnx-profile-list__label">メールアドレス</span>
          <span class="pnx-profile-list__value">keisuke@example.com</span>
          <span class="pnx-profile-list__chevron" aria-hidden="true"></span>
        </li>
        <li class="pnx-profile-list__row" data-row="phone" tabindex="0">
          <span class="pnx-profile-list__label">電話番号</span>
          <span class="pnx-profile-list__value">090-1234-5678</span>
          <span class="pnx-profile-list__chevron" aria-hidden="true"></span>
        </li>
      </ul>
    </section>

    <!-- 5. ゴルフプロフィールカード -->
    <section class="pnx-profile-card pnx-profile-listCard">
      <h2 class="pnx-profile-listCard__title">ゴルフプロフィール</h2>
      <ul class="pnx-profile-list">
        <li class="pnx-profile-list__row" data-row="user-type" tabindex="0">
          <span class="pnx-profile-list__label">ユーザー種別</span>
          <span class="pnx-profile-list__value">研修生</span>
          <span class="pnx-profile-list__chevron" aria-hidden="true"></span>
        </li>
        <li class="pnx-profile-list__row" data-row="area" tabindex="0">
          <span class="pnx-profile-list__label">活動エリア</span>
          <span class="pnx-profile-list__value">関東</span>
          <span class="pnx-profile-list__chevron" aria-hidden="true"></span>
        </li>
        <li class="pnx-profile-list__row" data-row="category" tabindex="0">
          <span class="pnx-profile-list__label">よく見る大会カテゴリ</span>
          <span class="pnx-profile-list__value">ミニツアー・県オープン</span>
          <span class="pnx-profile-list__chevron" aria-hidden="true"></span>
        </li>
        <li class="pnx-profile-list__row" data-row="base" tabindex="0">
          <span class="pnx-profile-list__label">所属・拠点</span>
          <span class="pnx-profile-list__value">埼玉</span>
          <span class="pnx-profile-list__chevron" aria-hidden="true"></span>
        </li>
      </ul>
    </section>

    <!-- 6. アプリ設定カード -->
    <section class="pnx-profile-card pnx-profile-listCard">
      <h2 class="pnx-profile-listCard__title">アプリ設定</h2>
      <ul class="pnx-profile-list">
        <li class="pnx-profile-list__row" data-row="public-profile" tabindex="0">
          <span class="pnx-profile-list__label">公開プロフィール</span>
          <span class="pnx-profile-list__value">公開中</span>
          <span class="pnx-profile-list__chevron" aria-hidden="true"></span>
        </li>
        <li class="pnx-profile-list__row" data-row="notify-email" tabindex="0">
          <span class="pnx-profile-list__label">通知用メール</span>
          <span class="pnx-profile-list__value">keisuke@example.com</span>
          <span class="pnx-profile-list__chevron" aria-hidden="true"></span>
        </li>
      </ul>
    </section>

    <!-- 7. アカウントカード -->
    <section class="pnx-profile-card pnx-profile-listCard">
      <h2 class="pnx-profile-listCard__title">アカウント</h2>
      <ul class="pnx-profile-list pnx-profile-list--simple">
        <li class="pnx-profile-list__row" data-row="change-password" tabindex="0">
          <span class="pnx-profile-list__label">パスワード変更</span>
          <span class="pnx-profile-list__chevron" aria-hidden="true"></span>
        </li>
        <li class="pnx-profile-list__row pnx-profile-list__row--danger" data-row="logout" tabindex="0">
          <span class="pnx-profile-list__label">ログアウト</span>
          <span class="pnx-profile-list__chevron pnx-profile-list__chevron--danger" aria-hidden="true"></span>
        </li>
      </ul>
    </section>

    <div class="pnx-profile-bottomSpacer"></div>
  </main>
</section>
  <script src="../../scripts/profile/profile.js?v=step182f-center-p-single"></script>
</body>
</html>
