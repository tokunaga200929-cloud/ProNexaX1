<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="theme-color" content="#ffffff" />
  <title>ProNexaX - デイリービュー</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="day-view.css" />
</head>
<body>
  <div class="app">

    <!-- ===== iPhone Status Bar ===== -->
    <div class="status-bar">
      <div class="status-bar__time">12:15</div>
      <div class="status-bar__icons">
        <span class="sb-icon sb-icon--bell">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/>
            <path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>
            <line x1="3" y1="3" x2="21" y2="21"/>
          </svg>
        </span>
        <span class="sb-signal">
          <i style="height:4px"></i><i style="height:6px"></i><i style="height:8px"></i><i style="height:10px"></i>
        </span>
        <span class="sb-net">4G</span>
        <span class="sb-battery"><span class="sb-battery__inner"></span></span>
      </div>
    </div>

    <!-- ===== App Header (minimal) ===== -->
    <header class="app-header">
      <button class="icon-btn" aria-label="メニュー">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
          <line x1="3" y1="7" x2="21" y2="7"/>
          <line x1="3" y1="12" x2="21" y2="12"/>
          <line x1="3" y1="17" x2="21" y2="17"/>
        </svg>
      </button>
      <h1 class="brand">ProNexa<span>X</span></h1>
      <div class="header-right">
        <button class="icon-btn" aria-label="検索">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
            <circle cx="11" cy="11" r="7"/>
            <line x1="21" y1="21" x2="16.5" y2="16.5"/>
          </svg>
        </button>
        <button class="icon-btn" aria-label="フィルター">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
            <line x1="4" y1="7" x2="20" y2="7"/>
            <line x1="7" y1="12" x2="17" y2="12"/>
            <line x1="10" y1="17" x2="14" y2="17"/>
          </svg>
        </button>
      </div>
      <span class="admin-pill">ADMIN</span>
    </header>
    <div class="header-divider"></div>

    <!-- ===== Scrollable Content ===== -->
    <main class="content">

      <!-- ===== Hero: Big Date ===== -->
      <section class="hero">
        <div class="hero__top">
          <button class="hero__back" aria-label="戻る" onclick="history.back()">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="15 18 9 12 15 6"/>
            </svg>
            <span>5月</span>
          </button>
          <button class="hero__today">今日</button>
        </div>
        <div class="hero__date-block">
          <div class="hero__day-row">
            <span class="hero__day">19</span>
            <span class="hero__day-meta">
              <span class="hero__weekday">火曜日</span>
              <span class="hero__year">2026年 5月</span>
            </span>
          </div>
        </div>
      </section>

      <!-- ===== Week Strip ===== -->
      <section class="week-strip" id="weekStrip">
        <!-- generated by JS -->
      </section>

      <!-- ===== Tournament Summary Card (simplified) ===== -->
      <section class="match-card">
        <div class="match-card__head">
          <span class="match-card__tag">大会</span>
          <span class="match-card__name">ABCカップ 2026 初日</span>
        </div>
        <div class="match-card__body">
          <div class="match-card__info">
            <div class="match-card__row">
              <span class="match-card__label">会場</span>
              <span class="match-card__value">栃木カントリークラブ</span>
            </div>
            <div class="match-card__row">
              <span class="match-card__label">スタート</span>
              <span class="match-card__value match-card__value--strong">7:42</span>
              <span class="match-card__value-sub">INコース</span>
            </div>
          </div>
          <div class="match-card__weather">
            <svg viewBox="0 0 40 40" width="38" height="38" aria-hidden="true">
              <circle cx="20" cy="20" r="7" fill="#FFC83D"/>
              <g stroke="#FFC83D" stroke-width="2" stroke-linecap="round">
                <line x1="20" y1="5" x2="20" y2="8"/>
                <line x1="20" y1="32" x2="20" y2="35"/>
                <line x1="5" y1="20" x2="8" y2="20"/>
                <line x1="32" y1="20" x2="35" y2="20"/>
                <line x1="9.4" y1="9.4" x2="11.5" y2="11.5"/>
                <line x1="28.5" y1="28.5" x2="30.6" y2="30.6"/>
                <line x1="9.4" y1="30.6" x2="11.5" y2="28.5"/>
                <line x1="28.5" y1="11.5" x2="30.6" y2="9.4"/>
              </g>
            </svg>
            <span class="match-card__temp">22°</span>
            <span class="match-card__cond">晴れ</span>
          </div>
        </div>
      </section>

      <!-- ===== Tabs (silent) ===== -->
      <nav class="tabs" role="tablist">
        <button class="tab tab--active" role="tab" aria-selected="true">日程</button>
        <button class="tab" role="tab">大会情報</button>
        <button class="tab" role="tab">同組</button>
        <button class="tab" role="tab">メモ</button>
      </nav>

      <!-- ===== Timeline ===== -->
      <section class="timeline" id="timeline">

        <!-- 5:30 移動 -->
        <div class="tl-row" data-time="5:30">
          <div class="tl-time">5:30</div>
          <div class="tl-axis">
            <span class="tl-dot tl-dot--blue"></span>
          </div>
          <article class="event-card event-card--travel">
            <div class="event-card__accent"></div>
            <div class="event-card__body">
              <div class="event-card__title">ホテル出発</div>
              <div class="event-card__sub">ホテル → 栃木カントリークラブ</div>
            </div>
            <button class="event-card__bell" aria-label="通知">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/>
                <path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>
              </svg>
            </button>
          </article>
        </div>

        <!-- 6:10 到着・受付 -->
        <div class="tl-row" data-time="6:10">
          <div class="tl-time">6:10</div>
          <div class="tl-axis">
            <span class="tl-dot tl-dot--green"></span>
          </div>
          <article class="event-card event-card--practice">
            <div class="event-card__accent"></div>
            <div class="event-card__body">
              <div class="event-card__title">ゴルフ場到着・受付</div>
              <div class="event-card__sub">受付・着替え</div>
            </div>
            <button class="event-card__bell" aria-label="通知">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/>
                <path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>
              </svg>
            </button>
          </article>
        </div>

        <!-- 6:30 練習場 -->
        <div class="tl-row" data-time="6:30">
          <div class="tl-time">6:30</div>
          <div class="tl-axis">
            <span class="tl-dot tl-dot--green"></span>
          </div>
          <article class="event-card event-card--practice">
            <div class="event-card__accent"></div>
            <div class="event-card__body">
              <div class="event-card__title">練習場</div>
              <div class="event-card__sub">打球練習　6:30 – 7:30</div>
            </div>
            <button class="event-card__bell" aria-label="通知">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/>
                <path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>
              </svg>
            </button>
          </article>
        </div>

        <!-- 7:42 START (重要) -->
        <div class="tl-row tl-row--start" data-time="7:42">
          <div class="tl-time tl-time--start">7:42</div>
          <div class="tl-axis">
            <span class="tl-dot tl-dot--red"></span>
          </div>
          <article class="event-card event-card--start">
            <div class="event-card__accent"></div>
            <div class="event-card__body">
              <div class="event-card__title">スタート　INコース</div>
              <div class="event-card__sub">ABCカップ　1R</div>
            </div>
            <button class="event-card__bell event-card__bell--active" aria-label="重要通知">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
                <path d="M12 22a2.5 2.5 0 0 0 2.45-2H9.55A2.5 2.5 0 0 0 12 22zm7-6V11a7 7 0 0 0-5.5-6.83V3.5a1.5 1.5 0 0 0-3 0v.67A7 7 0 0 0 5 11v5l-2 2v1h18v-1z"/>
              </svg>
            </button>
          </article>
        </div>

        <!-- 13:00 昼食 -->
        <div class="tl-row" data-time="13:00">
          <div class="tl-time">13:00</div>
          <div class="tl-axis">
            <span class="tl-dot tl-dot--meal"></span>
          </div>
          <article class="event-card event-card--meal">
            <div class="event-card__accent"></div>
            <div class="event-card__body">
              <div class="event-card__title">昼食・休憩</div>
              <div class="event-card__sub">クラブハウス　レストラン</div>
            </div>
            <button class="event-card__bell" aria-label="通知">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/>
                <path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>
              </svg>
            </button>
          </article>
        </div>

        <!-- 13:45 後半スタート -->
        <div class="tl-row" data-time="13:45">
          <div class="tl-time">13:45</div>
          <div class="tl-axis">
            <span class="tl-dot tl-dot--green"></span>
          </div>
          <article class="event-card event-card--practice">
            <div class="event-card__accent"></div>
            <div class="event-card__body">
              <div class="event-card__title">後半スタート</div>
              <div class="event-card__sub">OUTコース　10番ホール</div>
            </div>
            <button class="event-card__bell" aria-label="通知">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/>
                <path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>
              </svg>
            </button>
          </article>
        </div>

        <!-- 18:00 移動 -->
        <div class="tl-row" data-time="18:00">
          <div class="tl-time">18:00</div>
          <div class="tl-axis">
            <span class="tl-dot tl-dot--blue"></span>
          </div>
          <article class="event-card event-card--travel">
            <div class="event-card__accent"></div>
            <div class="event-card__body">
              <div class="event-card__title">移動</div>
              <div class="event-card__sub">栃木CC → ホテル</div>
            </div>
            <button class="event-card__bell" aria-label="通知">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/>
                <path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>
              </svg>
            </button>
          </article>
        </div>

        <!-- 19:00 ホテル -->
        <div class="tl-row tl-row--last" data-time="19:00">
          <div class="tl-time">19:00</div>
          <div class="tl-axis">
            <span class="tl-dot tl-dot--bluegray"></span>
          </div>
          <article class="event-card event-card--hotel">
            <div class="event-card__accent"></div>
            <div class="event-card__body">
              <div class="event-card__title">ホテルチェックイン</div>
              <div class="event-card__sub">ホテルサンシャイン宇都宮</div>
            </div>
            <button class="event-card__bell" aria-label="通知">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/>
                <path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>
              </svg>
            </button>
          </article>
        </div>
      </section>

      <!-- ===== Quick Info (2-card silent) ===== -->
      <section class="info-cards">
        <button class="info-card">
          <span class="info-card__label">次の予定</span>
          <span class="info-card__title">人事ミーティング</span>
          <span class="info-card__sub">明日　10:00</span>
        </button>
        <button class="info-card">
          <span class="info-card__label">持ち物</span>
          <span class="info-card__title">3 / 7　準備中</span>
          <div class="info-card__progress"><span style="width:43%"></span></div>
        </button>
      </section>

      <!-- bottom space for fab/tabbar -->
      <div class="bottom-spacer"></div>
    </main>

    <!-- ===== FAB ===== -->
    <button class="fab" id="fab" aria-label="予定を追加">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
        <line x1="12" y1="5" x2="12" y2="19"/>
        <line x1="5" y1="12" x2="19" y2="12"/>
      </svg>
    </button>

    <!-- ===== Bottom Tab Bar ===== -->
    <nav class="tabbar" aria-label="メインナビゲーション">
      <button class="tabbar__item tabbar__item--active">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="5" width="18" height="16" rx="2"/>
          <line x1="3" y1="10" x2="21" y2="10"/>
          <line x1="8" y1="3" x2="8" y2="7"/>
          <line x1="16" y1="3" x2="16" y2="7"/>
        </svg>
        <span>カレンダー</span>
      </button>
      <button class="tabbar__item">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
          <circle cx="11" cy="11" r="7"/>
          <line x1="21" y1="21" x2="16.5" y2="16.5"/>
        </svg>
        <span>試合検索</span>
      </button>
      <button class="tabbar__item tabbar__item--center" aria-label="ProNexaX">
        <span class="tabbar__center-circle">
          <span class="tabbar__center-p">P</span>
        </span>
      </button>
      <button class="tabbar__item">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="5" width="18" height="14" rx="2"/>
          <line x1="12" y1="9" x2="12" y2="15"/>
          <line x1="9" y1="12" x2="15" y2="12"/>
        </svg>
        <span>収支</span>
      </button>
      <button class="tabbar__item">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7" rx="1"/>
          <rect x="14" y="3" width="7" height="7" rx="1"/>
          <rect x="3" y="14" width="7" height="7" rx="1"/>
          <rect x="14" y="14" width="7" height="7" rx="1"/>
        </svg>
        <span>管理</span>
      </button>
    </nav>

    <!-- home indicator -->
    <div class="home-indicator"></div>

  </div>
  <script src="day-view.js"></script>
</body>
</html>
