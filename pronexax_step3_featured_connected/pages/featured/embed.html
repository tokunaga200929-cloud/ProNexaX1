<!DOCTYPE html>
<!--
  ProNexaX — 注目（feature）ページ  index.html
  ================================================================
  【本体統合時の作業メモ】
  1. <header class="page-header"> の内容を本体の注目セクションに移植
  2. バナー・カテゴリ・記事・プロモの各 <section> を本体に移植
  3. <nav class="bottom-nav"> は本体の共通ナビと置き換える
  4. <link rel="stylesheet" href="../../styles/featured/featured.css"> のパスを調整
  5. <script src="../../scripts/featured/featured.js"> のパスを調整し、
     navigateToFeature() と initBottomNav() を本体ロジックと接続

  【画像差し替え一覧】（パスは本体側に合わせて変更）
    Pロゴアイコン   ../../assets/images/p-tab-icon.png
    バナー 1〜3枚目 ../../assets/images/feature-hero-1〜3.jpg
    記事 サムネイル  ../../assets/images/article-driver / article-course / article-lesson .jpg
  ================================================================
-->
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>注目 — ProNexaX</title>
  <link rel="stylesheet" href="../../styles/featured/featured.css">

  <style>
    /* ProNexaX本体統合用：注目/広告単独版をiframe内で表示 */
    html, body {
      margin: 0 !important;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #F2F2F7 !important;
    }
    nav.bottom-nav,
    .bottom-nav {
      display: none !important;
    }
    body > *:first-child {
      min-height: 100dvh;
    }
  </style>

</head>
<body>

<div class="app-wrapper">
  <div class="scroll-content">

    <!-- ============================================================
         [1] HEADER
         sticky ヘッダー。スクロール時に JS が .scrolled を付与し
         frosted glass に変化する（script.js: initHeaderScroll）
         ============================================================ -->
    <header class="page-header">
      <div class="header-text">
        <h1 class="header-title">注目</h1>
        <p class="header-sub">ゴルフの最新情報やおすすめをお届け</p>
      </div>
      <div class="header-actions">
        <button class="header-icon-btn" aria-label="通知">
          <span class="notif-dot"></span>
          <svg width="18" height="18" viewBox="0 0 22 22" fill="none"
               stroke="#5A6E68" stroke-width="1.7"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M11 2a7 7 0 0 1 7 7v3l1.5 2.5H2.5L4 12V9a7 7 0 0 1 7-7z"/>
            <path d="M9 19a2 2 0 0 0 4 0"/>
          </svg>
        </button>
        <button class="header-icon-btn" aria-label="検索">
          <svg width="17" height="17" viewBox="0 0 22 22" fill="none"
               stroke="#5A6E68" stroke-width="1.7"
               stroke-linecap="round" stroke-linejoin="round">
            <circle cx="10" cy="10" r="6.5"/>
            <line x1="15" y1="15" x2="20" y2="20"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- ============================================================
         [2] MAIN BANNER（自動スライド）
         .banner-bg-1〜3 の background-image に画像を指定するだけで反映。
         スライド制御: script.js initBannerSlider
         ============================================================ -->
    <section class="banner-section">
      <div class="banner-card" role="img" aria-label="メインバナー">

        <!-- 背景スライド 1〜3（画像は CSS の .banner-bg-1〜3 で指定） -->
        <div class="banner-bg banner-bg-1"></div>
        <div class="banner-bg banner-bg-2"></div>
        <div class="banner-bg banner-bg-3"></div>

        <!-- テキスト可読性オーバーレイ（左→右 + 下→上 の2層グラデーション） -->
        <div class="banner-overlay"></div>

        <!-- バナーテキスト・ボタン -->
        <div class="banner-content">
          <span class="banner-label">PICK UP</span>
          <h2 class="banner-title">春の新作ウェア特集</h2>
          <p class="banner-desc">今シーズン注目のゴルフウェアを<br>一挙紹介します</p>
          <button class="banner-btn">
            詳しく見る
            <svg class="banner-btn-arrow" viewBox="0 0 14 14" fill="none"
                 stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <polyline points="4,3 10,7 4,11"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- スライダードット（JS で active クラスを切替） -->
      <div class="banner-dots" role="tablist" aria-label="スライド切替">
        <span class="dot active" role="tab" aria-selected="true"  tabindex="0"></span>
        <span class="dot"        role="tab" aria-selected="false" tabindex="0"></span>
        <span class="dot"        role="tab" aria-selected="false" tabindex="0"></span>
      </div>
    </section>

    <!-- ============================================================
         [3] CATEGORY（横スクロール）
         カテゴリは .cat-card を追加するだけで増やせる
         ============================================================ -->
    <section class="section">
      <div class="section-header">
        <h2 class="section-title">カテゴリから探す</h2>
      </div>
      <div class="category-scroll-wrap">
        <div class="category-row">

          <button class="cat-card">
            <div class="cat-icon">
              <svg viewBox="0 0 22 22">
                <path d="M8 2L5 5l-3 2 2 3 3-1v9h8V9l3 1 2-3-3-2-3-3"/>
                <line x1="8" y1="2" x2="11" y2="5"/>
                <line x1="14" y1="2" x2="11" y2="5"/>
              </svg>
            </div>
            <span class="cat-label">ウェア</span>
          </button>

          <button class="cat-card">
            <div class="cat-icon">
              <svg viewBox="0 0 22 22">
                <line x1="5" y1="4" x2="15" y2="18"/>
                <path d="M15 18 Q17 19 18 17 Q17 14 15 15"/>
                <circle cx="6" cy="5" r="2"/>
              </svg>
            </div>
            <span class="cat-label">クラブ</span>
          </button>

          <button class="cat-card">
            <div class="cat-icon">
              <svg viewBox="0 0 22 22">
                <path d="M3 18 Q11 10 19 14"/>
                <line x1="13" y1="4" x2="13" y2="14"/>
                <path d="M13 4 L18 7 L13 10"/>
              </svg>
            </div>
            <span class="cat-label">ゴルフ場</span>
          </button>

          <button class="cat-card">
            <div class="cat-icon">
              <svg viewBox="0 0 22 22">
                <rect x="2" y="5" width="18" height="13" rx="2.5"/>
                <polygon points="9,9 9,14 15,11.5" fill="var(--green-dark)" stroke="none"/>
              </svg>
            </div>
            <span class="cat-label">レッスン</span>
          </button>

          <button class="cat-card">
            <div class="cat-icon">
              <svg viewBox="0 0 22 22">
                <rect x="3" y="3" width="16" height="16" rx="2.5"/>
                <line x1="7" y1="8"  x2="15" y2="8"/>
                <line x1="7" y1="11" x2="15" y2="11"/>
                <line x1="7" y1="14" x2="11" y2="14"/>
              </svg>
            </div>
            <span class="cat-label">ニュース</span>
          </button>

        </div>
      </div>
    </section>

    <!-- ============================================================
         [4] ARTICLES（注目記事リスト）
         .article-card を複製して記事を追加できる。
         サムネイル画像は CSS の .article-thumb-1〜3 で指定。
         ============================================================ -->
    <section class="section">
      <div class="section-header">
        <h2 class="section-title">最新の注目記事</h2>
        <button class="section-more">もっと見る</button>
      </div>

      <div class="article-list">

        <!-- 記事 1 — サムネイル: ../../assets/images/article-driver.jpg -->
        <button class="article-card">
          <div class="article-thumb">
            <div class="article-thumb-img article-thumb-1"></div>
          </div>
          <div class="article-body">
            <div class="article-meta">
              <span class="article-badge">NEW</span>
              <span class="article-date">2025.5.12</span>
            </div>
            <p class="article-title">最新ドライバー徹底比較<br>2025年春モデル</p>
            <p class="article-desc">今季注目の新作ドライバー5本をプロが実打比較</p>
          </div>
          <svg class="article-arrow" width="8" height="14" viewBox="0 0 8 14"
               fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
            <polyline points="1,1 7,7 1,13"/>
          </svg>
        </button>

        <!-- 記事 2 — サムネイル: ../../assets/images/article-course.jpg -->
        <button class="article-card">
          <div class="article-thumb">
            <div class="article-thumb-img article-thumb-2"></div>
          </div>
          <div class="article-body">
            <div class="article-meta">
              <span class="article-badge">NEW</span>
              <span class="article-date">2025.5.10</span>
            </div>
            <p class="article-title">今週末に行きたい<br>おすすめゴルフ場特集</p>
            <p class="article-desc">関東・関西の絶景コース5選をご紹介</p>
          </div>
          <svg class="article-arrow" width="8" height="14" viewBox="0 0 8 14"
               fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
            <polyline points="1,1 7,7 1,13"/>
          </svg>
        </button>

        <!-- 記事 3 — サムネイル: ../../assets/images/article-lesson.jpg -->
        <button class="article-card">
          <div class="article-thumb">
            <div class="article-thumb-img article-thumb-3"></div>
          </div>
          <div class="article-body">
            <div class="article-meta">
              <!-- バッジカラーを変える場合は style で上書き -->
              <span class="article-badge" style="background:#5A6E68;">TIPS</span>
              <span class="article-date">2025.5.8</span>
            </div>
            <p class="article-title">プロが教える<br>アプローチの基本</p>
            <p class="article-desc">距離感と方向性を同時に鍛える練習法</p>
          </div>
          <svg class="article-arrow" width="8" height="14" viewBox="0 0 8 14"
               fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
            <polyline points="1,1 7,7 1,13"/>
          </svg>
        </button>

      </div>
    </section>

    <!-- ============================================================
         [5] PROMO BANNER（おすすめギア等）
         ============================================================ -->
    <section class="promo-section">
      <button class="promo-card" style="width:100%;text-align:left;">
        <div class="promo-text-wrap">
          <span class="promo-tag">おすすめギア</span>
          <p class="promo-title">スピン性能で選ぶなら<br>このボール！</p>
          <p class="promo-sub">プロも認めた高性能ボール特集</p>
        </div>
        <div class="promo-btn-wrap">
          <span class="promo-action-btn">見る</span>
        </div>
      </button>
    </section>

    <!-- 最下部余白（scroll-content の padding-bottom と併用） -->
    <div class="page-end-spacer"></div>

  </div><!-- /.scroll-content -->

  <!-- ============================================================
       [6] BOTTOM TAB NAV
       ★ 本体統合時: この <nav> ブロック全体を本体の共通ナビと置き換える
       　 中央Pロゴ(#nav-center)のタップ処理は script.js の
       　 navigateToFeature() に実装する
       ============================================================ -->
  <nav class="bottom-nav" aria-label="メインナビゲーション">

    <button class="bnav-btn" aria-label="カレンダー">
      <svg width="20" height="20" viewBox="0 0 22 22" fill="none"
           stroke="#9BB8AE" stroke-width="1.7" stroke-linecap="round">
        <rect x="3" y="4" width="16" height="15" rx="2.5"/>
        <line x1="7" y1="2" x2="7" y2="6"/>
        <line x1="15" y1="2" x2="15" y2="6"/>
        <line x1="3" y1="9" x2="19" y2="9"/>
      </svg>
      <span class="bnav-label">カレンダー</span>
    </button>

    <button class="bnav-btn" aria-label="試合検索">
      <svg width="20" height="20" viewBox="0 0 22 22" fill="none"
           stroke="#9BB8AE" stroke-width="1.7" stroke-linecap="round">
        <circle cx="10" cy="10" r="6"/>
        <line x1="14.5" y1="14.5" x2="19" y2="19"/>
      </svg>
      <span class="bnav-label">試合</span>
    </button>

    <!-- 中央Pロゴタブ — 画像: ../../assets/../../assets/images/p-tab-icon.png
         画像が読み込めない場合は .p-tab-fallback（白丸+P文字）を表示 -->
    <button class="bnav-btn center-tab" id="nav-center" aria-label="ProNexaX 注目">
      <img class="p-tab-icon"
           src="../../assets/../../assets/images/p-tab-icon.png"
           alt="P"
           onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
      <span class="p-tab-fallback" style="display:none;">P</span>
    </button>

    <button class="bnav-btn" aria-label="収支">
      <svg width="20" height="20" viewBox="0 0 22 22" fill="none"
           stroke="#9BB8AE" stroke-width="1.7" stroke-linecap="round">
        <rect x="3" y="5" width="16" height="12" rx="2"/>
        <line x1="7"  y1="11" x2="15" y2="11"/>
        <line x1="11" y1="8"  x2="11" y2="14"/>
      </svg>
      <span class="bnav-label">収支</span>
    </button>

    <button class="bnav-btn" aria-label="マイページ">
      <svg width="20" height="20" viewBox="0 0 22 22" fill="none"
           stroke="#9BB8AE" stroke-width="1.7" stroke-linecap="round">
        <circle cx="11" cy="8" r="3.5"/>
        <path d="M4 19c0-3.314 3.134-6 7-6s7 2.686 7 6"/>
      </svg>
      <span class="bnav-label">マイページ</span>
    </button>

  </nav>

</div><!-- /.app-wrapper -->

<script src="../../scripts/featured/featured.js"></script>
</body>
</html>
